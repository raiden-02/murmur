line="central">INT4</text><text class="tx" x="608.0" y="127.5" text-anchor="start" dominant-baseline="central">BF16</text><text class="tx" x="40.0" y="150.0" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 40 150.0)">tokens/s</text><text class="ts" x="345.0" y="282.0" text-anchor="middle" dominant-baseline="central">conversations generating together</text><text class="ts" x="40.0" y="310.0" text-anchor="start" dominant-baseline="central">Up to about 16 conversations a step is bound by reading the weights, so fewer bytes win almost in</text><text class="ts" x="40.0" y="328.0" text-anchor="start" dominant-baseline="central">proportion. Towards 64 the matrix math starts to dominate and the lines draw closer.</text></svg>
