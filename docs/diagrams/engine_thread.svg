76.0" class="ln" stroke-width="0.8" marker-end="url(#a)"/><text class="tx" x="110.0" y="188.0" text-anchor="middle" dominant-baseline="central">0 ms</text><text class="tx" x="245.0" y="188.0" text-anchor="middle" dominant-baseline="central">50 ms</text><text class="tx" x="380.0" y="188.0" text-anchor="middle" dominant-baseline="central">100 ms</text><text class="tx" x="515.0" y="188.0" text-anchor="middle" dominant-baseline="central">150 ms</text><text class="tx" x="650.0" y="188.0" text-anchor="middle" dominant-baseline="central">200 ms</text><text class="ts" x="40.0" y="216.0" text-anchor="start" dominant-baseline="central">Purple: frames every 16.7 ms (60 fps). Teal: one token each. Each finished token becomes an event the next</text><text class="ts" x="40.0" y="234.0" text-anchor="start" dominant-baseline="central">frame picks up (gray arrows); a frame only takes a short lock to read them, so the frame rate never drops.</text></svg>
