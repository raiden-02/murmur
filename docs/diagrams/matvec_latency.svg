<svg xmlns="http://www.w3.org/2000/svg" width="680" height="330" viewBox="0 0 680 330" role="img"><title>Loads in flight in the matrix-vector kernel</title><style>text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.th{font-size:14px;font-weight:600;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.tx{font-size:11px;fill:#888780}.mono{font-family:Consolas,'SF Mono',Menlo,monospace}.ln{stroke:#888780}.dash{stroke:#B4B2A9}.bg{fill:#FFFFFF}.grid{stroke:#E4E2DA}.b-purple{fill:#EEEDFE;stroke:#534AB7}.k-purple{fill:#3C3489}.s-purple{fill:#534AB7}.b-teal{fill:#E1F5EE;stroke:#0F6E56}.k-teal{fill:#085041}.s-teal{fill:#0F6E56}.b-gray{fill:#F1EFE8;stroke:#5F5E5A}.k-gray{fill:#444441}.s-gray{fill:#5F5E5A}.b-amber{fill:#FAEEDA;stroke:#854F0B}.k-amber{fill:#633806}.s-amber{fill:#854F0B}.b-coral{fill:#FAECE7;stroke:#993C1D}.k-coral{fill:#712B13}.s-coral{fill:#993C1D}.b-red{fill:#FCEBEB;stroke:#A32D2D}.k-red{fill:#791F1F}.s-red{fill:#A32D2D}.b-green{fill:#EAF3DE;stroke:#3B6D11}.k-green{fill:#27500A}.s-green{fill:#3B6D11}@media (prefers-color-scheme:dark){.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.tx{fill:#8A887F}.ln{stroke:#B4B2A9}.dash{stroke:#5F5E5A}.bg{fill:#1F1E1C}.grid{stroke:#34332F}.b-purple{fill:#3C3489;stroke:#AFA9EC}.k-purple{fill:#EEEDFE}.s-purple{fill:#CECBF6}.b-teal{fill:#085041;stroke:#5DCAA5}.k-teal{fill:#E1F5EE}.s-teal{fill:#9FE1CB}.b-gray{fill:#444441;stroke:#B4B2A9}.k-gray{fill:#F1EFE8}.s-gray{fill:#D3D1C7}.b-amber{fill:#633806;stroke:#EF9F27}.k-amber{fill:#FAEEDA}.s-amber{fill:#FAC775}.b-coral{fill:#712B13;stroke:#F0997B}.k-coral{fill:#FAECE7}.s-coral{fill:#F5C4B3}.b-red{fill:#791F1F;stroke:#F09595}.k-red{fill:#FCEBEB}.s-red{fill:#F7C1C1}.b-green{fill:#27500A;stroke:#97C459}.k-green{fill:#EAF3DE}.s-green{fill:#C0DD97}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" x="0" y="0" width="680" height="330" rx="12"/><text class="th" x="40.0" y="22.0" text-anchor="start" dominant-baseline="central">Why batching loads matters: one lane's timeline</text><text class="th" x="40.0" y="50.0" text-anchor="start" dominant-baseline="central">one load at a time</text><rect class="b-purple" x="190.0" y="38.0" width="20.0" height="22.0" rx="3" stroke-width="0.6"/><rect class="b-gray" x="210.0" y="38.0" width="90.0" height="22.0" rx="3" stroke-width="0.6"/><text class="ts k-gray" x="255.0" y="49.0" text-anchor="middle" dominant-baseline="central">wait ~500 ns</text><rect class="b-purple" x="302.0" y="38.0" width="20.0" height="22.0" rx="3" stroke-width="0.6"/><rect class="b-gray" x="322.0" y="38.0" width="90.0" height="22.0" rx="3" stroke-width="0.6"/><text class="ts k-gray" x="367.0" y="49.0" text-anchor="middle" dominant-baseline="central">wait ~500 ns</text><rect class="b-purple" x="414.0" y="38.0" width="20.0" height="22.0" rx="3" stroke-width="0.6"/><rect class="b-gray" x="434.0" y="38.0" width="90.0" height="22.0" rx="3" stroke-width="0.6"/><text class="ts k-gray" x="479.0" y="49.0" text-anchor="middle" dominant-baseline="central">wait ~500 ns</text><rect class="b-purple" x="526.0" y="38.0" width="20.0" height="22.0" rx="3" stroke-width="0.6"/><rect class="b-gray" x="546.0" y="38.0" width="90.0" height="22.0" rx="3" stroke-width="0.6"/><text class="ts k-gray" x="591.0" y="49.0" text-anchor="middle" dominant-baseline="central">wait ~500 ns</text><text class="th" x="40.0" y="92.0" text-anchor="start" dominant-baseline="central">4 loads issued together</text><rect class="b-purple" x="190.0" y="80.0" width="20.0" height="22.0" rx="3" stroke-width="0.6"/><rect class="b-purple" x="212.0" y="80.0" width="20.0" height="22.0" rx="3" stroke-width="0.6"/><rect class="b-purple" x="234.0" y="80.0" width="20.0" height="22.0" rx="3" stroke-width="0.6"/><rect class="b-purple" x="256.0" y="80.0" width="20.0" height="22.0" rx="3" stroke-width="0.6"/><rect class="b-gray" x="280.0" y="80.0" width="90.0" height="22.0" rx="3" stroke-width="0.6"/><text class="ts k-gray" x="325.0" y="91.0" text-anchor="middle" dominant-baseline="central">wait ~500 ns</text><rect class="b-teal" x="372.0" y="80.0" width="60.0" height="22.0" rx="3" stroke-width="0.6"/><text class="ts k-teal" x="402.0" y="91.0" text-anchor="middle" dominant-baseline="central">4 × math</text><text class="ts" x="40.0" y="128.0" text-anchor="start" dominant-baseline="central">purple = issue a 16-byte load, gray = wait for memory, teal = multiply-adds</text><text class="ts" x="40.0" y="156.0" text-anchor="start" dominant-baseline="central">Memory latency is fixed, so throughput comes from overlap: keep many loads in flight (Little's law).</text><text class="ts" x="40.0" y="174.0" text-anchor="start" dominant-baseline="central">Issuing a lane's next loads before using the first ones turned 4 waits into 1.</text><text class="th" x="40.0" y="206.0" text-anchor="start" dominant-baseline="central">Measured on the model's shapes, on a GPU shared with other programs:</text><text class="ts" x="40.0" y="236.0" text-anchor="start" dominant-baseline="central">before</text><rect class="b-coral" x="250.0" y="222.0" width="104.3" height="28.0" rx="4" stroke-width="0.6"/><text class="th" x="362.3" y="236.0" text-anchor="start" dominant-baseline="central">202 GB/s (27%)</text><text class="ts" x="40.0" y="270.0" text-anchor="start" dominant-baseline="central">loads batched</text><rect class="b-amber" x="250.0" y="256.0" width="233.4" height="28.0" rx="4" stroke-width="0.6"/><text class="th k-amber" x="260.0" y="270.0" text-anchor="start" dominant-baseline="central">452 GB/s (61%)</text><text class="ts" x="40.0" y="304.0" text-anchor="start" dominant-baseline="central">+ x via cache, rows/warp by size</text><rect class="b-teal" x="250.0" y="290.0" width="314.4" height="28.0" rx="4" stroke-width="0.6"/><text class="th k-teal" x="260.0" y="304.0" text-anchor="start" dominant-baseline="central">609 GB/s (83%)</text></svg>
