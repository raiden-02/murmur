<svg xmlns="http://www.w3.org/2000/svg" width="680" height="398" viewBox="0 0 680 398" role="img"><title>Who may evict whom</title><style>text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.th{font-size:14px;font-weight:600;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.tx{font-size:11px;fill:#888780}.mono{font-family:Consolas,'SF Mono',Menlo,monospace}.ln{stroke:#888780}.dash{stroke:#B4B2A9}.bg{fill:#FFFFFF}.grid{stroke:#E4E2DA}.b-purple{fill:#EEEDFE;stroke:#534AB7}.k-purple{fill:#3C3489}.s-purple{fill:#534AB7}.b-teal{fill:#E1F5EE;stroke:#0F6E56}.k-teal{fill:#085041}.s-teal{fill:#0F6E56}.b-gray{fill:#F1EFE8;stroke:#5F5E5A}.k-gray{fill:#444441}.s-gray{fill:#5F5E5A}.b-amber{fill:#FAEEDA;stroke:#854F0B}.k-amber{fill:#633806}.s-amber{fill:#854F0B}.b-coral{fill:#FAECE7;stroke:#993C1D}.k-coral{fill:#712B13}.s-coral{fill:#993C1D}.b-red{fill:#FCEBEB;stroke:#A32D2D}.k-red{fill:#791F1F}.s-red{fill:#A32D2D}.b-green{fill:#EAF3DE;stroke:#3B6D11}.k-green{fill:#27500A}.s-green{fill:#3B6D11}@media (prefers-color-scheme:dark){.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.tx{fill:#8A887F}.ln{stroke:#B4B2A9}.dash{stroke:#5F5E5A}.bg{fill:#1F1E1C}.grid{stroke:#34332F}.b-purple{fill:#3C3489;stroke:#AFA9EC}.k-purple{fill:#EEEDFE}.s-purple{fill:#CECBF6}.b-teal{fill:#085041;stroke:#5DCAA5}.k-teal{fill:#E1F5EE}.s-teal{fill:#9FE1CB}.b-gray{fill:#444441;stroke:#B4B2A9}.k-gray{fill:#F1EFE8}.s-gray{fill:#D3D1C7}.b-amber{fill:#633806;stroke:#EF9F27}.k-amber{fill:#FAEEDA}.s-amber{fill:#FAC775}.b-coral{fill:#712B13;stroke:#F0997B}.k-coral{fill:#FAECE7}.s-coral{fill:#F5C4B3}.b-red{fill:#791F1F;stroke:#F09595}.k-red{fill:#FCEBEB}.s-red{fill:#F7C1C1}.b-green{fill:#27500A;stroke:#97C459}.k-green{fill:#EAF3DE}.s-green{fill:#C0DD97}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" x="0" y="0" width="680" height="398" rx="12"/><text class="th" x="40.0" y="22.0" text-anchor="start" dominant-baseline="central">When the actions test froze: 31 replies (bar: pages each holds), none free</text><rect x="60.0" y="120.4" width="16.0" height="141.6" rx="2" fill="#1D9E75" fill-opacity="1.000"/><rect x="78.0" y="154.0" width="16.0" height="108.0" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="96.0" y="154.0" width="16.0" height="108.0" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="114.0" y="144.4" width="16.0" height="117.6" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="132.0" y="154.0" width="16.0" height="108.0" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="150.0" y="154.0" width="16.0" height="108.0" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="168.0" y="158.8" width="16.0" height="103.2" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="186.0" y="154.0" width="16.0" height="108.0" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="204.0" y="161.2" width="16.0" height="100.8" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="222.0" y="158.8" width="16.0" height="103.2" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="240.0" y="154.0" width="16.0" height="108.0" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="258.0" y="158.8" width="16.0" height="103.2" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="276.0" y="158.8" width="16.0" height="103.2" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="294.0" y="158.8" width="16.0" height="103.2" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="312.0" y="151.6" width="16.0" height="110.4" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="330.0" y="154.0" width="16.0" height="108.0" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="348.0" y="151.6" width="16.0" height="110.4" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="366.0" y="158.8" width="16.0" height="103.2" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="384.0" y="158.8" width="16.0" height="103.2" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="402.0" y="154.0" width="16.0" height="108.0" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="420.0" y="158.8" width="16.0" height="103.2" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="438.0" y="151.6" width="16.0" height="110.4" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="456.0" y="158.8" width="16.0" height="103.2" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="474.0" y="158.8" width="16.0" height="103.2" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="492.0" y="154.0" width="16.0" height="108.0" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="510.0" y="146.8" width="16.0" height="115.2" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="528.0" y="151.6" width="16.0" height="110.4" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="546.0" y="151.6" width="16.0" height="110.4" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="564.0" y="154.0" width="16.0" height="108.0" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="582.0" y="156.4" width="16.0" height="105.6" rx="2" fill="#E0921C" fill-opacity="0.850"/><rect x="600.0" y="151.6" width="16.0" height="110.4" rx="2" fill="#E0921C" fill-opacity="0.850"/><text class="tx" x="68.0" y="276.0" text-anchor="middle" dominant-baseline="central">oldest</text><text class="tx" x="608.0" y="276.0" text-anchor="middle" dominant-baseline="central">newest</text><line x1="98.0" y1="296.0" x2="578.0" y2="296.0" stroke="#8A887F" stroke-width="1.2" marker-end="url(#a)"/><text class="tx" x="338.0" y="310.0" text-anchor="middle" dominant-baseline="central">asked earlier → later</text><path d="M68.0 116.4 C128.0 62.400000000000006 548.0 62.400000000000006 608.0 145.60000000000002" fill="none" fill-opacity="1.0" stroke="#5E9E25" stroke-width="1.6" marker-end="url(#a)"/><text class="ts" x="338.0" y="52.4" text-anchor="middle" dominant-baseline="central">a reply may evict replies asked after it, newest first</text><rect x="40.0" y="331.0" width="10.0" height="10.0" rx="2" fill="#E0921C" fill-opacity="0.850"/><text class="tx" x="56.0" y="336.0" text-anchor="start" dominant-baseline="central">waiting for its first token</text><rect x="230.0" y="331.0" width="10.0" height="10.0" rx="2" fill="#1D9E75" fill-opacity="0.850"/><text class="tx" x="246.0" y="336.0" text-anchor="start" dominant-baseline="central">already generating</text><text class="tx" x="400.0" y="336.0" text-anchor="start" dominant-baseline="central">free pages: 0</text><text class="ts" x="40.0" y="358.0" text-anchor="start" dominant-baseline="central">Evicting freed nothing here: an engine already gone still held the same pages. And under the old rule,</text><text class="ts" x="40.0" y="376.0" text-anchor="start" dominant-baseline="central">no waiting reply could evict another. Ordered by age, the oldest reply can always make room.</text></svg>
