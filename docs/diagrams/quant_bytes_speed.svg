<svg xmlns="http://www.w3.org/2000/svg" width="680" height="240" viewBox="0 0 680 240" role="img"><title>Bytes per weight and decode speed</title><style>text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.th{font-size:14px;font-weight:600;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.tx{font-size:11px;fill:#888780}.mono{font-family:Consolas,'SF Mono',Menlo,monospace}.ln{stroke:#888780}.dash{stroke:#B4B2A9}.bg{fill:#FFFFFF}.grid{stroke:#E4E2DA}.b-purple{fill:#EEEDFE;stroke:#534AB7}.k-purple{fill:#3C3489}.s-purple{fill:#534AB7}.b-teal{fill:#E1F5EE;stroke:#0F6E56}.k-teal{fill:#085041}.s-teal{fill:#0F6E56}.b-gray{fill:#F1EFE8;stroke:#5F5E5A}.k-gray{fill:#444441}.s-gray{fill:#5F5E5A}.b-amber{fill:#FAEEDA;stroke:#854F0B}.k-amber{fill:#633806}.s-amber{fill:#854F0B}.b-coral{fill:#FAECE7;stroke:#993C1D}.k-coral{fill:#712B13}.s-coral{fill:#993C1D}.b-red{fill:#FCEBEB;stroke:#A32D2D}.k-red{fill:#791F1F}.s-red{fill:#A32D2D}.b-green{fill:#EAF3DE;stroke:#3B6D11}.k-green{fill:#27500A}.s-green{fill:#3B6D11}@media (prefers-color-scheme:dark){.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.tx{fill:#8A887F}.ln{stroke:#B4B2A9}.dash{stroke:#5F5E5A}.bg{fill:#1F1E1C}.grid{stroke:#34332F}.b-purple{fill:#3C3489;stroke:#AFA9EC}.k-purple{fill:#EEEDFE}.s-purple{fill:#CECBF6}.b-teal{fill:#085041;stroke:#5DCAA5}.k-teal{fill:#E1F5EE}.s-teal{fill:#9FE1CB}.b-gray{fill:#444441;stroke:#B4B2A9}.k-gray{fill:#F1EFE8}.s-gray{fill:#D3D1C7}.b-amber{fill:#633806;stroke:#EF9F27}.k-amber{fill:#FAEEDA}.s-amber{fill:#FAC775}.b-coral{fill:#712B13;stroke:#F0997B}.k-coral{fill:#FAECE7}.s-coral{fill:#F5C4B3}.b-red{fill:#791F1F;stroke:#F09595}.k-red{fill:#FCEBEB}.s-red{fill:#F7C1C1}.b-green{fill:#27500A;stroke:#97C459}.k-green{fill:#EAF3DE}.s-green{fill:#C0DD97}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" x="0" y="0" width="680" height="240" rx="12"/><text class="th" x="40.0" y="22.0" text-anchor="start" dominant-baseline="central">Fewer bytes per weight, more tokens per second</text><text class="tx" x="110.0" y="52.0" text-anchor="start" dominant-baseline="central">bytes read for every token (the weights)</text><text class="tx" x="390.0" y="52.0" text-anchor="start" dominant-baseline="central">tokens per second, one conversation</text><text class="ts" x="96.0" y="83.0" text-anchor="end" dominant-baseline="central">BF16</text><rect x="110.0" y="70.0" width="200.0" height="26.0" rx="3" fill="#8A887F" fill-opacity="0.850"/><text class="tx" x="316.0" y="83.0" text-anchor="start" dominant-baseline="central">3.09 GB</text><rect x="390.0" y="70.0" width="100.4" height="26.0" rx="3" fill="#8A887F" fill-opacity="0.850"/><text class="tx" x="496.4" y="83.0" text-anchor="start" dominant-baseline="central">164</text><text class="ts" x="96.0" y="123.0" text-anchor="end" dominant-baseline="central">FP8</text><rect x="110.0" y="110.0" width="100.3" height="26.0" rx="3" fill="#1D9E75" fill-opacity="0.850"/><text class="tx" x="216.3" y="123.0" text-anchor="start" dominant-baseline="central">1.55 GB</text><rect x="390.0" y="110.0" width="172.9" height="26.0" rx="3" fill="#1D9E75" fill-opacity="0.850"/><text class="tx" x="568.9" y="123.0" text-anchor="start" dominant-baseline="central">282</text><text class="ts" x="96.0" y="163.0" text-anchor="end" dominant-baseline="central">INT4</text><rect x="110.0" y="150.0" width="53.1" height="26.0" rx="3" fill="#7F77DD" fill-opacity="0.850"/><text class="tx" x="169.1" y="163.0" text-anchor="start" dominant-baseline="central">0.82 GB</text><rect x="390.0" y="150.0" width="220.0" height="26.0" rx="3" fill="#7F77DD" fill-opacity="0.850"/><text class="tx" x="616.0" y="163.0" text-anchor="start" dominant-baseline="central">359</text><text class="ts" x="40.0" y="204.0" text-anchor="start" dominant-baseline="central">A decode step reads every weight once, so its time is about bytes ÷ bandwidth: half the bytes,</text><text class="ts" x="40.0" y="222.0" text-anchor="start" dominant-baseline="central">nearly twice the tokens. Measured on the RTX 4080 SUPER, 1,024 tokens of context.</text></svg>
