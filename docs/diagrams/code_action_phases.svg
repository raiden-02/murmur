="424.0" y1="190.0" x2="511.8" y2="190.0" stroke="#8A887F" stroke-width="1.0"/><text class="tx mono" x="467.9" y="212.0" text-anchor="middle" dominant-baseline="central">WriteForced</text><line x1="515.3" y1="190.0" x2="564.3" y2="190.0" stroke="#8A887F" stroke-width="1.0"/><text class="tx mono" x="539.8" y="200.0" text-anchor="middle" dominant-baseline="central">AcceptAction</text><line x1="567.8" y1="190.0" x2="650.3" y2="190.0" stroke="#8A887F" stroke-width="1.0"/><text class="tx mono" x="609.0" y="212.0" text-anchor="middle" dominant-baseline="central">WriteForced</text><text class="tx mono" x="24.0" y="240.0" text-anchor="start" dominant-baseline="central">grammar_state</text><line x1="329.5" y1="240.0" x2="651.3" y2="240.0" stroke="#7F77DD" stroke-width="1.0"/><circle cx="329.5" cy="240.0" r="3" fill="#7F77DD" fill-opacity="1.0"/><circle cx="367.5" cy="240.0" r="3" fill="#7F77DD" fill-opacity="1.0"/><circle cx="385.0" cy="240.0" r="3" fill="#7F77DD" fill-opacity="1.0"/><circle cx="423.0" cy="240.0" r="3" fill="#7F77DD" fill-opacity="1.0"/><circle cx="479.3" cy="240.0" r="3" fill="#7F77DD" fill-opacity="1.0"/><circle cx="496.8" cy="240.0" r="3" fill="#7F77DD" fill-opacity="1.0"/><circle cx="514.3" cy="240.0" r="3" fill="#7F77DD" fill-opacity="1.0"/><circle cx="531.8" cy="240.0" r="3" fill="#7F77DD" fill-opacity="1.0"/><circle cx="549.3" cy="240.0" r="3" fill="#7F77DD" fill-opacity="1.0"/><circle cx="566.8" cy="240.0" r="3" fill="#7F77DD" fill-opacity="1.0"/><circle cx="584.3" cy="240.0" r="3" fill="#7F77DD" fill-opacity="1.0"/><circle cx="651.3" cy="240.0" r="3" fill="#8A887F" fill-opacity="1.0"/><text class="tx mono" x="323.5" y="240.0" text-anchor="end" dominant-baseline="central">Start()</text><text class="tx mono" x="617.8" y="230.0" text-anchor="middle" dominant-baseline="central">kFinished</text><text class="tx mono" x="24.0" y="266.0" text-anchor="start" dominant-baseline="central">phase</text><rect class="b-teal" x="112.0" y="257.0" width="134.7" height="18.0" rx="3" stroke-width="0.6"/><text class="tx k-teal mono" x="179.3" y="266.0" text-anchor="middle" dominant-baseline="central">kSpeaking</text><rect class="b-purple" x="248.2" y="257.0" width="334.6" height="18.0" rx="3" stroke-width="0.6"/><text class="tx k-purple mono" x="415.5" y="266.0" text-anchor="middle" dominant-baseline="central">kActing</text><rect class="b-gray" x="584.3" y="257.0" width="67.0" height="18.0" rx="3" stroke-width="0.6"/><text class="tx k-gray mono" x="617.8" y="266.0" text-anchor="middle" dominant-baseline="central">kActed</text><rect class="b-teal" x="24.0" y="294.0" width="12.0" height="12.0" rx="3" stroke-width="0.6"/><text class="tx" x="42.0" y="300.0" text-anchor="start" dominant-baseline="central">chosen by the model under the speech mask</text><rect class="b-purple" x="271.2" y="294.0" width="12.0" height="12.0" rx="3" stroke-width="0.6"/><text class="tx" x="289.2" y="300.0" text-anchor="start" dominant-baseline="central">chosen under the grammar's mask</text><rect class="b-gray" x="466.4" y="294.0" width="12.0" height="12.0" rx="3" stroke-width="0.6"/><text class="tx" x="484.4" y="300.0" text-anchor="start" dominant-baseline="central">written without a model step</text><text class="ts" x="24.0" y="322.0" text-anchor="start" dominant-baseline="central">The stop token is sampled but not appended: Accept calls StartAction, which appends the lead-in instead.</text><text class="ts" x="24.0" y="340.0" text-anchor="start" dominant-baseline="central">Each dot is a grammar_state; each action token moves it on. Tokens written without a model step go</text><text class="ts" x="24.0" y="358.0" text-anchor="start" dominant-baseline="central">through the model in the next step, with the token it chooses then.</text><text class="tx mono" x="24.0" y="384.0" text-anchor="start" dominant-baseline="central">lines 637–643</text><text class="tx" x="130.0" y="384.0" text-anchor="start" dominant-baseline="central">SamplingFor: the speech mask while kSpeaking, DeviceMask(grammar_state) while kActing</text><text class="tx mono" x="24.0" y="401.0" text-anchor="start" dominant-baseline="central">lines 535–539</text><text class="tx" x="130.0" y="401.0" text-anchor="start" dominant-baseline="central">Accept: a stop token starts the action instead of being appended</text><text class="tx mono" x="24.0" y="418.0" text-anchor="start" dominant-baseline="central">lines 561–564</text><text class="tx" x="130.0" y="418.0" text-anchor="start" dominant-baseline="central">StartAction: append the lead-in, phase = kActing, grammar_state = Start()</text><text class="tx mono" x="24.0" y="435.0" text-anchor="start" dominant-baseline="central">lines 588–601</text><text class="tx" x="130.0" y="435.0" text-anchor="start" dominant-baseline="central">AcceptAction: grammar_state = Next(grammar_state, token); the end token finishes</text><text class="tx mono" x="24.0" y="452.0" text-anchor="start" dominant-baseline="central">lines 614–625</text><text class="tx" x="130.0" y="452.0" text-anchor="start" dominant-baseline="central">WriteForced: append each token Forced(grammar_state) holds, without a model step</text></svg>
