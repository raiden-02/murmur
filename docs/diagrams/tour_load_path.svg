<svg xmlns="http://www.w3.org/2000/svg" width="680" height="326" viewBox="0 0 680 326" role="img"><title>Startup load path</title><style>text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.th{font-size:14px;font-weight:600;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.tx{font-size:11px;fill:#888780}.mono{font-family:Consolas,'SF Mono',Menlo,monospace}.ln{stroke:#888780}.dash{stroke:#B4B2A9}.bg{fill:#FFFFFF}.grid{stroke:#E4E2DA}.b-purple{fill:#EEEDFE;stroke:#534AB7}.k-purple{fill:#3C3489}.s-purple{fill:#534AB7}.b-teal{fill:#E1F5EE;stroke:#0F6E56}.k-teal{fill:#085041}.s-teal{fill:#0F6E56}.b-gray{fill:#F1EFE8;stroke:#5F5E5A}.k-gray{fill:#444441}.s-gray{fill:#5F5E5A}.b-amber{fill:#FAEEDA;stroke:#854F0B}.k-amber{fill:#633806}.s-amber{fill:#854F0B}.b-coral{fill:#FAECE7;stroke:#993C1D}.k-coral{fill:#712B13}.s-coral{fill:#993C1D}.b-red{fill:#FCEBEB;stroke:#A32D2D}.k-red{fill:#791F1F}.s-red{fill:#A32D2D}.b-green{fill:#EAF3DE;stroke:#3B6D11}.k-green{fill:#27500A}.s-green{fill:#3B6D11}@media (prefers-color-scheme:dark){.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.tx{fill:#8A887F}.ln{stroke:#B4B2A9}.dash{stroke:#5F5E5A}.bg{fill:#1F1E1C}.grid{stroke:#34332F}.b-purple{fill:#3C3489;stroke:#AFA9EC}.k-purple{fill:#EEEDFE}.s-purple{fill:#CECBF6}.b-teal{fill:#085041;stroke:#5DCAA5}.k-teal{fill:#E1F5EE}.s-teal{fill:#9FE1CB}.b-gray{fill:#444441;stroke:#B4B2A9}.k-gray{fill:#F1EFE8}.s-gray{fill:#D3D1C7}.b-amber{fill:#633806;stroke:#EF9F27}.k-amber{fill:#FAEEDA}.s-amber{fill:#FAC775}.b-coral{fill:#712B13;stroke:#F0997B}.k-coral{fill:#FAECE7}.s-coral{fill:#F5C4B3}.b-red{fill:#791F1F;stroke:#F09595}.k-red{fill:#FCEBEB}.s-red{fill:#F7C1C1}.b-green{fill:#27500A;stroke:#97C459}.k-green{fill:#EAF3DE}.s-green{fill:#C0DD97}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" x="0" y="0" width="680" height="326" rx="12"/><text class="th" x="40.0" y="22.0" text-anchor="start" dominant-baseline="central">Startup: three files on disk become an engine on the GPU</text><line x1="130.0" y1="80.0" x2="650.0" y2="80.0" class="ln" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="120.0" y="64.0" text-anchor="end" dominant-baseline="central">disk</text><line x1="130.0" y1="160.0" x2="650.0" y2="160.0" class="ln" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="120.0" y="144.0" text-anchor="end" dominant-baseline="central">CPU memory</text><line x1="130.0" y1="240.0" x2="650.0" y2="240.0" class="ln" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="120.0" y="224.0" text-anchor="end" dominant-baseline="central">GPU memory</text><rect class="b-gray" x="150.0" y="50.0" width="130.0" height="26.0" rx="3" stroke-width="0.6"/><text class="ts k-gray mono" x="215.0" y="63.0" text-anchor="middle" dominant-baseline="central">config.json</text><rect class="b-gray" x="300.0" y="50.0" width="130.0" height="26.0" rx="3" stroke-width="0.6"/><text class="ts k-gray mono" x="365.0" y="63.0" text-anchor="middle" dominant-baseline="central">tokenizer.json</text><rect class="b-gray" x="470.0" y="50.0" width="130.0" height="26.0" rx="3" stroke-width="0.6"/><text class="ts k-gray mono" x="535.0" y="63.0" text-anchor="middle" dominant-baseline="central">model.safetensors</text><rect class="b-amber" x="150.0" y="130.0" width="130.0" height="26.0" rx="3" stroke-width="0.6"/><text class="ts k-amber mono" x="215.0" y="143.0" text-anchor="middle" dominant-baseline="central">ModelConfig</text><rect class="b-amber" x="300.0" y="130.0" width="130.0" height="26.0" rx="3" stroke-width="0.6"/><text class="ts k-amber mono" x="365.0" y="143.0" text-anchor="middle" dominant-baseline="central">Tokenizer</text><rect class="b-amber" x="470.0" y="130.0" width="130.0" height="26.0" rx="3" stroke-width="0.6"/><text class="ts k-amber mono" x="535.0" y="143.0" text-anchor="middle" dominant-baseline="central">memory map</text><line x1="215.0" y1="78.0" x2="215.0" y2="128.0" stroke="#8A887F" stroke-width="1.4" marker-end="url(#a)"/><line x1="365.0" y1="78.0" x2="365.0" y2="128.0" stroke="#8A887F" stroke-width="1.4" marker-end="url(#a)"/><line x1="535.0" y1="78.0" x2="535.0" y2="128.0" stroke="#8A887F" stroke-width="1.4" marker-end="url(#a)"/><text class="tx" x="222.0" y="104.0" text-anchor="start" dominant-baseline="central">FromFile</text><text class="tx" x="372.0" y="104.0" text-anchor="start" dominant-baseline="central">FromFile</text><text class="tx" x="542.0" y="104.0" text-anchor="start" dominant-baseline="central">MappedFile</text><rect class="b-teal" x="390.0" y="210.0" width="100.0" height="26.0" rx="3" stroke-width="0.6"/><text class="tx k-teal" x="440.0" y="223.0" text-anchor="middle" dominant-baseline="central">weights 3.09 GB</text><rect class="b-coral" x="500.0" y="210.0" width="70.0" height="26.0" rx="3" stroke-width="0.6"/><text class="tx k-coral" x="535.0" y="223.0" text-anchor="middle" dominant-baseline="central">KV cache</text><rect class="b-purple" x="580.0" y="210.0" width="66.0" height="26.0" rx="3" stroke-width="0.6"/><text class="tx k-purple" x="613.0" y="223.0" text-anchor="middle" dominant-baseline="central">buffers</text><line x1="500.0" y1="158.0" x2="450.0" y2="208.0" stroke="#1D9E75" stroke-width="1.4" marker-end="url(#a)"/><text class="tx" x="470.0" y="186.0" text-anchor="end" dominant-baseline="central">Upload (stacked, BF16)</text><text class="tx" x="390.0" y="260.0" text-anchor="start" dominant-baseline="central">Transformer allocates the cache and every buffer once</text><text class="ts" x="40.0" y="290.0" text-anchor="start" dominant-baseline="central">The weights are copied straight out of the mapped file onto the GPU (no buffer of our own in between), and</text><text class="ts" x="40.0" y="308.0" text-anchor="start" dominant-baseline="central">the map is closed once they're there. The config and tokenizer stay on the CPU; only numbers go to the GPU.</text></svg>
