arker></defs><rect class="bg" x="0" y="0" width="680" height="306" rx="12"/><text class="th" x="40.0" y="22.0" text-anchor="start" dominant-baseline="central">Why the first two layers keep BF16 in an FP8 cache: their keys are far larger</text><rect x="72.0" y="50.0" width="16.0" height="160.0" rx="2" fill="#E0921C" fill-opacity="0.850"/><text class="tx" x="80.0" y="41.0" text-anchor="middle" dominant-baseline="central">318</text><rect x="92.0" y="158.6" width="16.0" height="51.4" rx="2" fill="#E0921C" fill-opacity="0.850"/><text class="tx" x="100.0" y="149.6" text-anchor="middle" dominant-baseline="central">102</text><rect x="112.0" y="198.0" width="16.0" height="12.0" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="132.0" y="201.7" width="16.0" height="8.3" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="152.0" y="202.1" width="16.0" height="7.9" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="172.0" y="204.5" width="16.0" height="5.5" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="192.0" y="205.0" width="16.0" height="5.0" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="212.0" y="192.5" width="16.0" height="17.5" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="232.0" y="205.0" width="16.0" height="5.0" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="252.0" y="203.1" width="16.0" height="6.9" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="272.0" y="203.5" width="16.0" height="6.5" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="292.0" y="203.6" width="16.0" height="6.4" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="312.0" y="205.8" width="16.0" height="4.2" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="332.0" y="204.4" width="16.0" height="5.6" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="352.0" y="205.0" width="16.0" height="5.0" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="372.0" y="182.7" width="16.0" height="27.3" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="392.0" y="205.3" width="16.0" height="4.7" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="412.0" y="205.6" width="16.0" height="4.4" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="432.0" y="201.5" width="16.0" height="8.5" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="452.0" y="203.9" width="16.0" height="6.1" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="472.0" y="203.2" width="16.0" height="6.8" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="492.0" y="204.0" width="16.0" height="6.0" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="512.0" y="203.8" width="16.0" height="6.2" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="532.0" y="204.4" width="16.0" height="5.6" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="552.0" y="204.2" width="16.0" height="5.8" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="572.0" y="202.6" width="16.0" height="7.4" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="592.0" y="205.7" width="16.0" height="4.3" rx="2" fill="#1D9E75" fill-opacity="0.850"/><rect x="612.0" y="205.2" width="16.0" height="4.8" rx="2" fill="#1D9E75" fill-opacity="0.850"/><text class="tx" x="620.0" y="196.2" text-anchor="middle" dominant-baseline="central">9</text><text class="tx" x="70.0" y="224.0" text-anchor="start" dominant-baseline="central">layer 0</text><text class="tx" x="630.0" y="224.0" text-anchor="end" dominant-baseline="central">layer 27</text><text class="ts" x="40.0" y="252.0" text-anchor="start" dominant-baseline="central">The largest |key| per layer on the reference prompt. Layer 0's attention scores swing by ±140, so its</text><text class="ts" x="40.0" y="270.0" text-anchor="start" dominant-baseline="central">attention picks single tokens; E4M3's 3 mantissa bits move those scores by up to 12, which changes</text><text class="ts" x="40.0" y="288.0" text-anchor="start" dominant-baseline="central">the pick (mean KL 1.3 with every layer in FP8). With layers 0 and 1 in BF16 it is 0.0065.</text></svg>
