<svg xmlns="http://www.w3.org/2000/svg" width="680" height="524" viewBox="0 0 680 524" role="img"><title>The whole system</title><style>text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.th{font-size:14px;font-weight:600;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.tx{font-size:11px;fill:#888780}.mono{font-family:Consolas,'SF Mono',Menlo,monospace}.ln{stroke:#888780}.dash{stroke:#B4B2A9}.bg{fill:#FFFFFF}.grid{stroke:#E4E2DA}.b-purple{fill:#EEEDFE;stroke:#534AB7}.k-purple{fill:#3C3489}.s-purple{fill:#534AB7}.b-teal{fill:#E1F5EE;stroke:#0F6E56}.k-teal{fill:#085041}.s-teal{fill:#0F6E56}.b-gray{fill:#F1EFE8;stroke:#5F5E5A}.k-gray{fill:#444441}.s-gray{fill:#5F5E5A}.b-amber{fill:#FAEEDA;stroke:#854F0B}.k-amber{fill:#633806}.s-amber{fill:#854F0B}.b-coral{fill:#FAECE7;stroke:#993C1D}.k-coral{fill:#712B13}.s-coral{fill:#993C1D}.b-red{fill:#FCEBEB;stroke:#A32D2D}.k-red{fill:#791F1F}.s-red{fill:#A32D2D}.b-green{fill:#EAF3DE;stroke:#3B6D11}.k-green{fill:#27500A}.s-green{fill:#3B6D11}@media (prefers-color-scheme:dark){.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.tx{fill:#8A887F}.ln{stroke:#B4B2A9}.dash{stroke:#5F5E5A}.bg{fill:#1F1E1C}.grid{stroke:#34332F}.b-purple{fill:#3C3489;stroke:#AFA9EC}.k-purple{fill:#EEEDFE}.s-purple{fill:#CECBF6}.b-teal{fill:#085041;stroke:#5DCAA5}.k-teal{fill:#E1F5EE}.s-teal{fill:#9FE1CB}.b-gray{fill:#444441;stroke:#B4B2A9}.k-gray{fill:#F1EFE8}.s-gray{fill:#D3D1C7}.b-amber{fill:#633806;stroke:#EF9F27}.k-amber{fill:#FAEEDA}.s-amber{fill:#FAC775}.b-coral{fill:#712B13;stroke:#F0997B}.k-coral{fill:#FAECE7}.s-coral{fill:#F5C4B3}.b-red{fill:#791F1F;stroke:#F09595}.k-red{fill:#FCEBEB}.s-red{fill:#F7C1C1}.b-green{fill:#27500A;stroke:#97C459}.k-green{fill:#EAF3DE}.s-green{fill:#C0DD97}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" x="0" y="0" width="680" height="524" rx="12"/><text class="th" x="24.0" y="22.0" text-anchor="start" dominant-baseline="central">The whole system: where each part runs, and what crosses between them</text><rect x="16.0" y="50.0" width="136.0" height="354.0" rx="8" fill="#7F77DD" fill-opacity="0.080"/><text class="ts" x="26.0" y="66.0" text-anchor="start" dominant-baseline="central">game thread</text><text class="tx" x="26.0" y="81.0" text-anchor="start" dominant-baseline="central">CPU, 60 frames a second</text><rect x="246.0" y="50.0" width="186.0" height="354.0" rx="8" fill="#1D9E75" fill-opacity="0.080"/><text class="ts" x="256.0" y="66.0" text-anchor="start" dominant-baseline="central">worker thread</text><text class="tx" x="256.0" y="81.0" text-anchor="start" dominant-baseline="central">CPU, one engine step after another</text><rect x="528.0" y="50.0" width="136.0" height="354.0" rx="8" fill="#D85A30" fill-opacity="0.080"/><text class="ts" x="538.0" y="66.0" text-anchor="start" dominant-baseline="central">GPU</text><text class="tx" x="538.0" y="81.0" text-anchor="start" dominant-baseline="central">one stream, in order</text><rect class="b-purple" x="24.0" y="98.0" width="120.0" height="26.0" rx="4" stroke-width="0.6"/><text class="tx" x="32.0" y="111.0" text-anchor="start" dominant-baseline="central">frame loop</text><text class="tx" x="138.0" y="111.0" text-anchor="end" dominant-baseline="central">51</text><rect class="b-purple" x="24.0" y="132.0" width="120.0" height="26.0" rx="4" stroke-width="0.6"/><text class="tx" x="32.0" y="145.0" text-anchor="start" dominant-baseline="central">Market, 32 NPCs</text><text class="tx" x="138.0" y="145.0" text-anchor="end" dominant-baseline="central">49</text><rect class="b-purple" x="24.0" y="166.0" width="120.0" height="26.0" rx="4" stroke-width="0.6"/><text class="tx" x="32.0" y="179.0" text-anchor="start" dominant-baseline="central">Dialogue, X-ray</text><text class="tx" x="138.0" y="179.0" text-anchor="end" dominant-baseline="central">50</text><rect class="b-purple" x="24.0" y="200.0" width="120.0" height="26.0" rx="4" stroke-width="0.6"/><text class="tx" x="32.0" y="213.0" text-anchor="start" dominant-baseline="central">action language</text><text class="tx" x="138.0" y="213.0" text-anchor="end" dominant-baseline="central">47</text><rect class="b-teal" x="254.0" y="98.0" width="170.0" height="26.0" rx="4" stroke-width="0.6"/><text class="tx" x="262.0" y="111.0" text-anchor="start" dominant-baseline="central">InferenceService::Run</text><text class="tx" x="418.0" y="111.0" text-anchor="end" dominant-baseline="central">36</text><rect class="b-gray" x="254.0" y="134.0" width="170.0" height="214.0" rx="6" stroke-width="0.6"/><text class="ts" x="262.0" y="148.0" text-anchor="start" dominant-baseline="central">Engine::Step</text><text class="tx" x="418.0" y="148.0" text-anchor="end" dominant-baseline="central">32</text><rect class="b-teal" x="262.0" y="162.0" width="154.0" height="26.0" rx="4" stroke-width="0.6"/><text class="tx" x="270.0" y="175.0" text-anchor="start" dominant-baseline="central">conversations</text><text class="tx" x="410.0" y="175.0" text-anchor="end" dominant-baseline="central">31</text><rect class="b-teal" x="262.0" y="198.0" width="154.0" height="26.0" rx="4" stroke-width="0.6"/><text class="tx" x="270.0" y="211.0" text-anchor="start" dominant-baseline="central">Plan, MakeRoom</text><text class="tx" x="410.0" y="211.0" text-anchor="end" dominant-baseline="central">33–34</text><rect class="b-teal" x="262.0" y="234.0" width="154.0" height="26.0" rx="4" stroke-width="0.6"/><text class="tx" x="270.0" y="247.0" text-anchor="start" dominant-baseline="central">KV pages, prefix cache</text><text class="tx" x="410.0" y="247.0" text-anchor="end" dominant-baseline="central">7–9</text><rect class="b-teal" x="262.0" y="270.0" width="154.0" height="26.0" rx="4" stroke-width="0.6"/><text class="tx" x="270.0" y="283.0" text-anchor="start" dominant-baseline="central">tokens out, actions</text><text class="tx" x="410.0" y="283.0" text-anchor="end" dominant-baseline="central">35, 45</text><rect class="b-teal" x="262.0" y="306.0" width="154.0" height="26.0" rx="4" stroke-width="0.6"/><text class="tx" x="270.0" y="319.0" text-anchor="start" dominant-baseline="central">draft model guesses</text><text class="tx" x="410.0" y="319.0" text-anchor="end" dominant-baseline="central">46</text><rect class="b-teal" x="254.0" y="358.0" width="170.0" height="26.0" rx="4" stroke-width="0.6"/><text class="tx" x="262.0" y="371.0" text-anchor="start" dominant-baseline="central">tokenizer, chat format</text><text class="tx" x="418.0" y="371.0" text-anchor="end" dominant-baseline="central">5–6</text><rect class="b-coral" x="536.0" y="98.0" width="120.0" height="26.0" rx="4" stroke-width="0.6"/><text class="tx" x="544.0" y="111.0" text-anchor="start" dominant-baseline="central">Transformer</text><text class="tx" x="650.0" y="111.0" text-anchor="end" dominant-baseline="central">24–25</text><rect class="b-coral" x="536.0" y="132.0" width="120.0" height="26.0" rx="4" stroke-width="0.6"/><text class="tx" x="544.0" y="145.0" text-anchor="start" dominant-baseline="central">28 layers × 6</text><text class="tx" x="650.0" y="145.0" text-anchor="end" dominant-baseline="central">13–18</text><rect class="b-coral" x="536.0" y="166.0" width="120.0" height="26.0" rx="4" stroke-width="0.6"/><text class="tx" x="544.0" y="179.0" text-anchor="start" dominant-baseline="central">attention</text><text class="tx" x="650.0" y="179.0" text-anchor="end" dominant-baseline="central">28, 30</text><rect class="b-coral" x="536.0" y="200.0" width="120.0" height="26.0" rx="4" stroke-width="0.6"/><text class="tx" x="544.0" y="213.0" text-anchor="start" dominant-baseline="central">sampling</text><text class="tx" x="650.0" y="213.0" text-anchor="end" dominant-baseline="central">19, 26</text><text class="tx" x="536.0" y="252.0" text-anchor="start" dominant-baseline="central">memory, 3.76 GB</text><rect class="b-coral" x="536.0" y="262.0" width="22.0" height="52.8" rx="2" stroke-width="0.6"/><rect class="b-amber" x="536.0" y="314.8" width="22.0" height="75.2" rx="2" stroke-width="0.6"/><text class="tx" x="566.0" y="281.4" text-anchor="start" dominant-baseline="central">weights 1.55 GB</text><text class="tx" x="566.0" y="295.4" text-anchor="start" dominant-baseline="central">FP8 (22, 37)</text><text class="tx" x="566.0" y="345.4" text-anchor="start" dominant-baseline="central">KV cache 2.21 GB</text><text class="tx" x="566.0" y="359.4" text-anchor="start" dominant-baseline="central">4,813 pages (23)</text><path d="M144 145 C 199.0 145, 199.0 111, 254 111" fill="none" fill-opacity="1.0" stroke="#8A887F" stroke-width="1.2" marker-end="url(#a)"/><text class="tx" x="199.0" y="84.0" text-anchor="middle" dominant-baseline="central">1 Ask(text)</text><path d="M424 190 C 480.0 190, 480.0 111, 536 111" fill="none" fill-opacity="1.0" stroke="#8A887F" stroke-width="1.2" marker-end="url(#a)"/><text class="tx" x="480.0" y="84.0" text-anchor="middle" dominant-baseline="central">2 tokens,</text><text class="tx" x="480.0" y="98.0" text-anchor="middle" dominant-baseline="central">page tables</text><path d="M536 213 C 480.0 213, 480.0 250, 424 250" fill="none" fill-opacity="1.0" stroke="#8A887F" stroke-width="1.2" marker-end="url(#a)"/><text class="tx" x="480.0" y="268.0" text-anchor="middle" dominant-baseline="central">3 token ids,</text><text class="tx" x="480.0" y="282.0" text-anchor="middle" dominant-baseline="central">4 B each</text><path d="M254 280 C 199.0 280, 199.0 179, 144 179" fill="none" fill-opacity="1.0" stroke="#8A887F" stroke-width="1.2" marker-end="url(#a)"/><text class="tx" x="199.0" y="250.0" text-anchor="middle" dominant-baseline="central">4 text,</text><text class="tx" x="199.0" y="264.0" text-anchor="middle" dominant-baseline="central">actions</text><text class="tx" x="199.0" y="372.0" text-anchor="middle" dominant-baseline="central">a queue each</text><text class="tx" x="199.0" y="386.0" text-anchor="middle" dominant-baseline="central">way, mutex_ (36)</text><text class="tx" x="480.0" y="372.0" text-anchor="middle" dominant-baseline="central">pinned</text><text class="tx" x="480.0" y="386.0" text-anchor="middle" dominant-baseline="central">buffer (24)</text><rect class="b-gray" x="246.0" y="420.0" width="418.0" height="26.0" rx="4" stroke-width="0.6"/><text class="tx mono" x="254.0" y="433.0" text-anchor="start" dominant-baseline="central">disk: config.json, tokenizer.json, model.safetensors</text><text class="tx" x="658.0" y="433.0" text-anchor="end" dominant-baseline="central">1–3, 22</text><line x1="339.0" y1="420.0" x2="339.0" y2="406.0" stroke="#8A887F" stroke-width="1.0" stroke-dasharray="4 3" marker-end="url(#a)"/><line x1="596.0" y1="420.0" x2="596.0" y2="406.0" stroke="#8A887F" stroke-width="1.0" stroke-dasharray="4 3" marker-end="url(#a)"/><text class="tx" x="24.0" y="433.0" text-anchor="start" dominant-baseline="central">read once, at startup</text><text class="ts" x="24.0" y="470.0" text-anchor="start" dominant-baseline="central">Each part sits in the column where its code runs; the numbers are the tour's chapters. Every step,</text><text class="ts" x="24.0" y="488.0" text-anchor="start" dominant-baseline="central">1 the game queues messages, 2 the worker sends the GPU one batch, 3 gets one token id per</text><text class="ts" x="24.0" y="506.0" text-anchor="start" dominant-baseline="central">conversation back, and 4 hands the game text and actions. Chapter 52 follows one message through it.</text></svg>
