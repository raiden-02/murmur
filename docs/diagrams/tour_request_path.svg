rker></defs><rect class="bg" x="0" y="0" width="680" height="318" rx="12"/><text class="th" x="40.0" y="22.0" text-anchor="start" dominant-baseline="central">One message, end to end: who runs what, in time order</text><line x1="120.0" y1="69.0" x2="660.0" y2="69.0" class="ln" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="110.0" y="69.0" text-anchor="end" dominant-baseline="central">game thread</text><line x1="120.0" y1="149.0" x2="660.0" y2="149.0" class="ln" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="110.0" y="149.0" text-anchor="end" dominant-baseline="central">worker thread</text><line x1="120.0" y1="229.0" x2="660.0" y2="229.0" class="ln" stroke-width="0.5" stroke-dasharray="4 3"/><text class="ts" x="110.0" y="229.0" text-anchor="end" dominant-baseline="central">GPU</text><rect class="b-purple" x="124.0" y="56.0" width="34.5" height="26.0" rx="3" stroke-width="0.6"/><text class="tx k-purple mono" x="141.2" y="69.0" text-anchor="middle" dominant-baseline="central">Say</text><line x1="150.0" y1="84.0" x2="160.0" y2="134.0" stroke="#8A887F" stroke-width="1.0" marker-end="url(#a)"/><rect class="b-teal" x="160.0" y="136.0" width="54.9" height="26.0" rx="3" stroke-width="0.6"/><text class="tx k-teal mono" x="187.5" y="149.0" text-anchor="middle" dominant-baseline="central">Encode</text><rect class="b-coral" x="216.0" y="216.0" width="64.0" height="26.0" rx="3" stroke-width="0.6"/><text class="tx k-coral mono" x="248.0" y="229.0" text-anchor="middle" dominant-baseline="central">prefill</text><line x1="200.0" y1="164.0" x2="222.0" y2="214.0" stroke="#8A887F" stroke-width="1.0" marker-end="url(#a)"/><rect class="b-coral" x="290.0" y="216.0" width="34.0" height="26.0" rx="3" stroke-width="0.6"/><text class="tx k-coral mono" x="307.0" y="229.0" text-anchor="middle" dominant-baseline="central">step</text><line x1="307.0" y1="214.0" x2="320.0" y2="164.0" stroke="#8A887F" stroke-width="0.8" marker-end="url(#a)"/><rect class="b-teal" x="312.0" y="136.0" width="34.0" height="26.0" rx="3" stroke-width="0.6"/><text class="tx k-teal mono" x="329.0" y="149.0" text-anchor="middle" dominant-baseline="central">pick</text><line x1="330.0" y1="134.0" x2="350.0" y2="84.0" stroke="#8A887F" stroke-width="0.8" marker-end="url(#a)"/><rect class="b-purple" x="336.0" y="56.0" width="36.0" height="26.0" rx="3" stroke-width="0.6"/><text class="tx k-purple mono" x="354.0" y="69.0" text-anchor="middle" dominant-baseline="central">draw</text><rect class="b-coral" x="362.0" y="216.0" width="34.0" height="26.0" rx="3" stroke-width="0.6"/><text class="tx k-coral mono" x="379.0" y="229.0" text-anchor="middle" dominant-baseline="central">step</text><line x1="379.0" y1="214.0" x2="392.0" y2="164.0" stroke="#8A887F" stroke-width="0.8" marker-end="url(#a)"/><rect class="b-teal" x="384.0" y="136.0" width="34.0" height="26.0" rx="3" stroke-width="0.6"/><text class="tx k-teal mono" x="401.0" y="149.0" text-anchor="middle" dominant-baseline="central">pick</text><line x1="402.0" y1="134.0" x2="422.0" y2="84.0" stroke="#8A887F" stroke-width="0.8" marker-end="url(#a)"/><rect class="b-purple" x="408.0" y="56.0" width="36.0" height="26.0" rx="3" stroke-width="0.6"/><text class="tx k-purple mono" x="426.0" y="69.0" text-anchor="middle" dominant-baseline="central">draw</text><rect class="b-coral" x="434.0" y="216.0" width="34.0" height="26.0" rx="3" stroke-width="0.6"/><text class="tx k-coral mono" x="451.0" y="229.0" text-anchor="middle" dominant-baseline="central">step</text><line x1="451.0" y1="214.0" x2="464.0" y2="164.0" stroke="#8A887F" stroke-width="0.8" marker-end="url(#a)"/><rect class="b-teal" x="456.0" y="136.0" width="34.0" height="26.0" rx="3" stroke-width="0.6"/><text class="tx k-teal mono" x="473.0" y="149.0" text-anchor="middle" dominant-baseline="central">pick</text><line x1="474.0" y1="134.0" x2="494.0" y2="84.0" stroke="#8A887F" stroke-width="0.8" marker-end="url(#a)"/><rect class="b-purple" x="480.0" y="56.0" width="36.0" height="26.0" rx="3" stroke-width="0.6"/><text class="tx k-purple mono" x="498.0" y="69.0" text-anchor="middle" dominant-baseline="central">draw</text><rect class="b-coral" x="506.0" y="216.0" width="34.0" height="26.0" rx="3" stroke-width="0.6"/><text class="tx k-coral mono" x="523.0" y="229.0" text-anchor="middle" dominant-baseline="central">step</text><line x1="523.0" y1="214.0" x2="536.0" y2="164.0" stroke="#8A887F" stroke-width="0.8" marker-end="url(#a)"/><rect class="b-teal" x="528.0" y="136.0" width="34.0" height="26.0" rx="3" stroke-width="0.6"/><text class="tx k-teal mono" x="545.0" y="149.0" text-anchor="middle" dominant-baseline="central">pick</text><line x1="546.0" y1="134.0" x2="566.0" y2="84.0" stroke="#8A887F" stroke-width="0.8" marker-end="url(#a)"/><rect class="b-purple" x="552.0" y="56.0" width="36.0" height="26.0" rx="3" stroke-width="0.6"/><text class="tx k-purple mono" x="570.0" y="69.0" text-anchor="middle" dominant-baseline="central">draw</text><rect class="b-coral" x="578.0" y="216.0" width="34.0" height="26.0" rx="3" stroke-width="0.6"/><text class="tx k-coral mono" x="595.0" y="229.0" text-anchor="middle" dominant-baseline="central">step</text><line x1="595.0" y1="214.0" x2="608.0" y2="164.0" stroke="#8A887F" stroke-width="0.8" marker-end="url(#a)"/><rect class="b-teal" x="600.0" y="136.0" width="34.0" height="26.0" rx="3" stroke-width="0.6"/><text class="tx k-teal mono" x="617.0" y="149.0" text-anchor="middle" dominant-baseline="central">pick</text><line x1="618.0" y1="134.0" x2="638.0" y2="84.0" stroke="#8A887F" stroke-width="0.8" marker-end="url(#a)"/><rect class="b-purple" x="624.0" y="56.0" width="36.0" height="26.0" rx="3" stroke-width="0.6"/><text class="tx k-purple mono" x="642.0" y="69.0" text-anchor="middle" dominant-baseline="central">draw</text><text class="tx" x="124.0" y="268.0" text-anchor="start" dominant-baseline="central">Say → Ask: queue the message.  Encode: chat template + tokenizer.  prefill: the prompt in a step.</text><text class="tx" x="124.0" y="284.0" text-anchor="start" dominant-baseline="central">Then per token: one engine step for every conversation at once, GPU sampling, StreamingDecoder,</text><text class="tx" x="124.0" y="300.0" text-anchor="start" dominant-baseline="central">and the next frame drains the text event and grows the speech bubble.</text></svg>
