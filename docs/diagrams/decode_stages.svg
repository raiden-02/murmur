<svg xmlns="http://www.w3.org/2000/svg" width="680" height="368" viewBox="0 0 680 368" role="img"><title>Decode speed stage by stage</title><style>text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.th{font-size:14px;font-weight:600;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.tx{font-size:11px;fill:#888780}.mono{font-family:Consolas,'SF Mono',Menlo,monospace}.ln{stroke:#888780}.dash{stroke:#B4B2A9}.bg{fill:#FFFFFF}.grid{stroke:#E4E2DA}.b-purple{fill:#EEEDFE;stroke:#534AB7}.k-purple{fill:#3C3489}.s-purple{fill:#534AB7}.b-teal{fill:#E1F5EE;stroke:#0F6E56}.k-teal{fill:#085041}.s-teal{fill:#0F6E56}.b-gray{fill:#F1EFE8;stroke:#5F5E5A}.k-gray{fill:#444441}.s-gray{fill:#5F5E5A}.b-amber{fill:#FAEEDA;stroke:#854F0B}.k-amber{fill:#633806}.s-amber{fill:#854F0B}.b-coral{fill:#FAECE7;stroke:#993C1D}.k-coral{fill:#712B13}.s-coral{fill:#993C1D}.b-red{fill:#FCEBEB;stroke:#A32D2D}.k-red{fill:#791F1F}.s-red{fill:#A32D2D}.b-green{fill:#EAF3DE;stroke:#3B6D11}.k-green{fill:#27500A}.s-green{fill:#3B6D11}@media (prefers-color-scheme:dark){.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.tx{fill:#8A887F}.ln{stroke:#B4B2A9}.dash{stroke:#5F5E5A}.bg{fill:#1F1E1C}.grid{stroke:#34332F}.b-purple{fill:#3C3489;stroke:#AFA9EC}.k-purple{fill:#EEEDFE}.s-purple{fill:#CECBF6}.b-teal{fill:#085041;stroke:#5DCAA5}.k-teal{fill:#E1F5EE}.s-teal{fill:#9FE1CB}.b-gray{fill:#444441;stroke:#B4B2A9}.k-gray{fill:#F1EFE8}.s-gray{fill:#D3D1C7}.b-amber{fill:#633806;stroke:#EF9F27}.k-amber{fill:#FAEEDA}.s-amber{fill:#FAC775}.b-coral{fill:#712B13;stroke:#F0997B}.k-coral{fill:#FAECE7}.s-coral{fill:#F5C4B3}.b-red{fill:#791F1F;stroke:#F09595}.k-red{fill:#FCEBEB}.s-red{fill:#F7C1C1}.b-green{fill:#27500A;stroke:#97C459}.k-green{fill:#EAF3DE}.s-green{fill:#C0DD97}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" x="0" y="0" width="680" height="368" rx="12"/><text class="th" x="40.0" y="22.0" text-anchor="start" dominant-baseline="central">Single-stream decode, stage by stage (idle GPU, best of 4 runs)</text><text class="ts" x="40.0" y="46.0" text-anchor="start" dominant-baseline="central">tokens/s at context length:</text><rect class="b-purple" x="220.0" y="36.0" width="14.0" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="240.0" y="43.0" text-anchor="start" dominant-baseline="central">128</text><rect class="b-teal" x="310.0" y="36.0" width="14.0" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="330.0" y="43.0" text-anchor="start" dominant-baseline="central">1,024</text><rect class="b-amber" x="400.0" y="36.0" width="14.0" height="14" rx="3" stroke-width="0.5"/><text class="ts" x="420.0" y="43.0" text-anchor="start" dominant-baseline="central">3,800</text><text class="th" x="40.0" y="88.0" text-anchor="start" dominant-baseline="central">first engine: FP32</text><rect class="b-purple" x="220.0" y="66.0" width="176.0" height="13" rx="3" stroke-width="0.5"/><text class="ts" x="402.0" y="73.0" text-anchor="start" dominant-baseline="central">88  (74%)</text><rect class="b-teal" x="220.0" y="81.0" width="132.0" height="13" rx="3" stroke-width="0.5"/><text class="ts" x="358.0" y="88.0" text-anchor="start" dominant-baseline="central">66  (56%)</text><rect class="b-amber" x="220.0" y="96.0" width="76.0" height="13" rx="3" stroke-width="0.5"/><text class="ts" x="302.0" y="103.0" text-anchor="start" dominant-baseline="central">38  (33%)</text><text class="th" x="40.0" y="152.0" text-anchor="start" dominant-baseline="central">+ BF16, fused matvec</text><rect class="b-purple" x="220.0" y="130.0" width="358.0" height="13" rx="3" stroke-width="0.5"/><text class="ts" x="584.0" y="137.0" text-anchor="start" dominant-baseline="central">179  (75%)</text><rect class="b-teal" x="220.0" y="145.0" width="218.0" height="13" rx="3" stroke-width="0.5"/><text class="ts" x="444.0" y="152.0" text-anchor="start" dominant-baseline="central">109  (47%)</text><rect class="b-amber" x="220.0" y="160.0" width="98.0" height="13" rx="3" stroke-width="0.5"/><text class="ts" x="324.0" y="167.0" text-anchor="start" dominant-baseline="central">49  (22%)</text><text class="th" x="40.0" y="216.0" text-anchor="start" dominant-baseline="central">+ split-K attention</text><rect class="b-purple" x="220.0" y="194.0" width="370.0" height="13" rx="3" stroke-width="0.5"/><text class="ts" x="596.0" y="201.0" text-anchor="start" dominant-baseline="central">185  (78%)</text><rect class="b-teal" x="220.0" y="209.0" width="360.0" height="13" rx="3" stroke-width="0.5"/><text class="ts" x="586.0" y="216.0" text-anchor="start" dominant-baseline="central">180  (77%)</text><rect class="b-amber" x="220.0" y="224.0" width="342.0" height="13" rx="3" stroke-width="0.5"/><text class="ts" x="568.0" y="231.0" text-anchor="start" dominant-baseline="central">171  (77%)</text><text class="th" x="40.0" y="280.0" text-anchor="start" dominant-baseline="central">+ CUDA graphs</text><rect class="b-purple" x="220.0" y="258.0" width="386.0" height="13" rx="3" stroke-width="0.5"/><text class="ts" x="612.0" y="265.0" text-anchor="start" dominant-baseline="central">193  (81%)</text><rect class="b-teal" x="220.0" y="273.0" width="376.0" height="13" rx="3" stroke-width="0.5"/><text class="ts" x="602.0" y="280.0" text-anchor="start" dominant-baseline="central">188  (80%)</text><rect class="b-amber" x="220.0" y="288.0" width="360.0" height="13" rx="3" stroke-width="0.5"/><text class="ts" x="586.0" y="295.0" text-anchor="start" dominant-baseline="central">180  (81%)</text><text class="ts" x="40.0" y="332.0" text-anchor="start" dominant-baseline="central">% = share of the bandwidth ceiling: every weight + the KV cache read once per token at 736 GB/s.</text><text class="ts" x="40.0" y="350.0" text-anchor="start" dominant-baseline="central">BF16 doubled the ceiling, which exposed the old attention kernel at long contexts; split-K fixed that.</text></svg>
