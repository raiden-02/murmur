nd"/></marker></defs><rect class="bg" x="0" y="0" width="680" height="306" rx="12"/><text class="th" x="40.0" y="22.0" text-anchor="start" dominant-baseline="central">One memory budget, 3.75 GB: what the weights leave holds the NPCs' memories</text><text class="ts" x="142.0" y="64.0" text-anchor="end" dominant-baseline="central">BF16 + BF16 cache</text><rect x="150.0" y="52.0" width="304.2" height="24.0" rx="3" fill="#E0921C" fill-opacity="0.850"/><rect x="454.2" y="52.0" width="65.8" height="24.0" rx="3" fill="#1D9E75" fill-opacity="0.450"/><text class="ts" x="530.0" y="64.0" text-anchor="start" dominant-baseline="central">24 NPC memories</text><text class="ts" x="142.0" y="100.0" text-anchor="end" dominant-baseline="central">FP8 + BF16 cache</text><rect x="150.0" y="88.0" width="152.6" height="24.0" rx="3" fill="#E0921C" fill-opacity="0.850"/><rect x="302.6" y="88.0" width="217.4" height="24.0" rx="3" fill="#1D9E75" fill-opacity="0.450"/><text class="ts" x="530.0" y="100.0" text-anchor="start" dominant-baseline="central">80 NPC memories</text><text class="ts" x="142.0" y="136.0" text-anchor="end" dominant-baseline="central">INT4 + BF16 cache</text><rect x="150.0" y="124.0" width="80.7" height="24.0" rx="3" fill="#E0921C" fill-opacity="0.850"/><rect x="230.7" y="124.0" width="289.3" height="24.0" rx="3" fill="#1D9E75" fill-opacity="0.450"/><text class="ts" x="530.0" y="136.0" text-anchor="start" dominant-baseline="central">106 NPC memories</text><text class="ts" x="142.0" y="172.0" text-anchor="end" dominant-baseline="central">FP8 + FP8 cache</text><rect x="150.0" y="160.0" width="152.6" height="24.0" rx="3" fill="#E0921C" fill-opacity="0.850"/><rect x="302.6" y="160.0" width="217.4" height="24.0" rx="3" fill="#1D9E75" fill-opacity="0.800"/><text class="ts" x="530.0" y="172.0" text-anchor="start" dominant-baseline="central">145 NPC memories</text><text class="ts" x="142.0" y="208.0" text-anchor="end" dominant-baseline="central">INT4 + FP8 cache</text><rect x="150.0" y="196.0" width="80.7" height="24.0" rx="3" fill="#E0921C" fill-opacity="0.850"/><rect x="230.7" y="196.0" width="289.3" height="24.0" rx="3" fill="#1D9E75" fill-opacity="0.800"/><text class="ts" x="530.0" y="208.0" text-anchor="start" dominant-baseline="central">193 NPC memories</text><rect x="150.0" y="236.0" width="12.0" height="12.0" rx="2" fill="#E0921C" fill-opacity="0.850"/><text class="tx" x="168.0" y="242.0" text-anchor="start" dominant-baseline="central">weights</text><rect x="240.0" y="236.0" width="12.0" height="12.0" rx="2" fill="#1D9E75" fill-opacity="0.600"/><text class="tx" x="258.0" y="242.0" text-anchor="start" dominant-baseline="central">KV cache</text><text class="ts" x="40.0" y="270.0" text-anchor="start" dominant-baseline="central">An NPC memory is 960 cached tokens (the shared lore, its persona, its latest turns). The market has</text><text class="ts" x="40.0" y="288.0" text-anchor="start" dominant-baseline="central">32 NPCs: with BF16 weights they don't all fit, and the quiet ones forget sooner.</text></svg>
