" x="662.0" y="382.0" text-anchor="end" dominant-baseline="central">469</text><text class="tx" x="24.0" y="400.0" text-anchor="start" dominant-baseline="central">Loop ends: every runnable conversation was looked at (plan.size() 4 &lt; max_batch 64, rows_left 469 &gt; 0).</text><text class="ts" x="24.0" y="426.0" text-anchor="start" dominant-baseline="central">Amber: a prompt cut to its budget, and the tokens each row takes from prefill_left and rows_left.</text><text class="ts" x="24.0" y="443.0" text-anchor="start" dominant-baseline="central">A decode always gets 1 token; a Priority() 0 prompt gets at most prefill_left; a higher one, rows_left.</text><text class="tx mono" x="24.0" y="466.0" text-anchor="start" dominant-baseline="central">lines 425–434</text><text class="tx" x="118.0" y="466.0" text-anchor="start" dominant-baseline="central">sort: higher Priority() first, then decodes, then least recently run / asked first</text><text class="tx mono" x="24.0" y="483.0" text-anchor="start" dominant-baseline="central">line 442</text><text class="tx" x="118.0" y="483.0" text-anchor="start" dominant-baseline="central">stop when the batch is full or the step has no rows left</text><text class="tx mono" x="24.0" y="500.0" text-anchor="start" dominant-baseline="central">lines 453–454</text><text class="tx" x="118.0" y="500.0" text-anchor="start" dominant-baseline="central">budget, and count: 1 for a decode, else the uncached tokens cut to the budget</text><text class="tx mono" x="24.0" y="517.0" text-anchor="start" dominant-baseline="central">line 461</text><text class="tx" x="118.0" y="517.0" text-anchor="start" dominant-baseline="central">count 0 (no budget left) or no pages: skip it and look at the next</text><text class="tx mono" x="24.0" y="534.0" text-anchor="start" dominant-baseline="central">lines 464–467</text><text class="tx" x="118.0" y="534.0" text-anchor="start" dominant-baseline="central">take its tokens from rows_left, and from prefill_left if it is a prompt</text></svg>
