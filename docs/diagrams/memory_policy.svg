<svg xmlns="http://www.w3.org/2000/svg" width="680" height="286" viewBox="0 0 680 286" role="img"><title>Memory policy before and after</title><style>text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.th{font-size:14px;font-weight:600;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.tx{font-size:11px;fill:#888780}.mono{font-family:Consolas,'SF Mono',Menlo,monospace}.ln{stroke:#888780}.dash{stroke:#B4B2A9}.bg{fill:#FFFFFF}.grid{stroke:#E4E2DA}.b-purple{fill:#EEEDFE;stroke:#534AB7}.k-purple{fill:#3C3489}.s-purple{fill:#534AB7}.b-teal{fill:#E1F5EE;stroke:#0F6E56}.k-teal{fill:#085041}.s-teal{fill:#0F6E56}.b-gray{fill:#F1EFE8;stroke:#5F5E5A}.k-gray{fill:#444441}.s-gray{fill:#5F5E5A}.b-amber{fill:#FAEEDA;stroke:#854F0B}.k-amber{fill:#633806}.s-amber{fill:#854F0B}.b-coral{fill:#FAECE7;stroke:#993C1D}.k-coral{fill:#712B13}.s-coral{fill:#993C1D}.b-red{fill:#FCEBEB;stroke:#A32D2D}.k-red{fill:#791F1F}.s-red{fill:#A32D2D}.b-green{fill:#EAF3DE;stroke:#3B6D11}.k-green{fill:#27500A}.s-green{fill:#3B6D11}@media (prefers-color-scheme:dark){.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.tx{fill:#8A887F}.ln{stroke:#B4B2A9}.dash{stroke:#5F5E5A}.bg{fill:#1F1E1C}.grid{stroke:#34332F}.b-purple{fill:#3C3489;stroke:#AFA9EC}.k-purple{fill:#EEEDFE}.s-purple{fill:#CECBF6}.b-teal{fill:#085041;stroke:#5DCAA5}.k-teal{fill:#E1F5EE}.s-teal{fill:#9FE1CB}.b-gray{fill:#444441;stroke:#B4B2A9}.k-gray{fill:#F1EFE8}.s-gray{fill:#D3D1C7}.b-amber{fill:#633806;stroke:#EF9F27}.k-amber{fill:#FAEEDA}.s-amber{fill:#FAC775}.b-coral{fill:#712B13;stroke:#F0997B}.k-coral{fill:#FAECE7}.s-coral{fill:#F5C4B3}.b-red{fill:#791F1F;stroke:#F09595}.k-red{fill:#FCEBEB}.s-red{fill:#F7C1C1}.b-green{fill:#27500A;stroke:#97C459}.k-green{fill:#EAF3DE}.s-green{fill:#C0DD97}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" x="0" y="0" width="680" height="286" rx="12"/><text class="th" x="40.0" y="22.0" text-anchor="start" dominant-baseline="central">When memory runs out: the same 30 talking NPCs, before and after the memory policy</text><text class="ts" x="60.0" y="52.0" text-anchor="start" dominant-baseline="central">tokens per second</text><rect x="60.0" y="162.5" width="52.0" height="27.5" rx="2" fill="#8A887F" fill-opacity="0.850"/><text class="tx" x="86.0" y="153.5" text-anchor="middle" dominant-baseline="central">375</text><text class="tx" x="86.0" y="204.0" text-anchor="middle" dominant-baseline="central">before</text><rect x="130.0" y="85.7" width="52.0" height="104.3" rx="2" fill="#1D9E75" fill-opacity="0.850"/><text class="tx" x="156.0" y="76.7" text-anchor="middle" dominant-baseline="central">1,424</text><text class="tx" x="156.0" y="204.0" text-anchor="middle" dominant-baseline="central">after</text><text class="ts" x="265.0" y="52.0" text-anchor="start" dominant-baseline="central">conversations per step</text><rect x="265.0" y="162.2" width="52.0" height="27.8" rx="2" fill="#8A887F" fill-opacity="0.850"/><text class="tx" x="291.0" y="153.2" text-anchor="middle" dominant-baseline="central">8</text><text class="tx" x="291.0" y="204.0" text-anchor="middle" dominant-baseline="central">before</text><rect x="335.0" y="85.7" width="52.0" height="104.3" rx="2" fill="#1D9E75" fill-opacity="0.850"/><text class="tx" x="361.0" y="76.7" text-anchor="middle" dominant-baseline="central">30</text><text class="tx" x="361.0" y="204.0" text-anchor="middle" dominant-baseline="central">after</text><text class="ts" x="470.0" y="52.0" text-anchor="start" dominant-baseline="central">evictions in 30 s</text><rect x="470.0" y="85.7" width="52.0" height="104.3" rx="2" fill="#8A887F" fill-opacity="0.850"/><text class="tx" x="496.0" y="76.7" text-anchor="middle" dominant-baseline="central">1,969</text><text class="tx" x="496.0" y="204.0" text-anchor="middle" dominant-baseline="central">before</text><rect x="540.0" y="190.0" width="52.0" height="1.5" rx="2" fill="#1D9E75" fill-opacity="0.850"/><text class="tx" x="566.0" y="181.0" text-anchor="middle" dominant-baseline="central">0</text><text class="tx" x="566.0" y="204.0" text-anchor="middle" dominant-baseline="central">after</text><text class="ts" x="40.0" y="232.0" text-anchor="start" dominant-baseline="central">Before: conversations grew without limit, and a conversation waiting to start could evict one in the middle of</text><text class="ts" x="40.0" y="250.0" text-anchor="start" dominant-baseline="central">a reply, so they kept evicting each other and recomputing. After: each NPC remembers at most 960 tokens</text><text class="ts" x="40.0" y="268.0" text-anchor="start" dominant-baseline="central">(the lore, its persona, its latest turns), and only idle or lower-priority conversations are evicted.</text></svg>
