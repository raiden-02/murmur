<svg xmlns="http://www.w3.org/2000/svg" width="680" height="232" viewBox="0 0 680 232" role="img"><title>Chat session and the KV cache</title><style>text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.th{font-size:14px;font-weight:600;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.tx{font-size:11px;fill:#888780}.mono{font-family:Consolas,'SF Mono',Menlo,monospace}.ln{stroke:#888780}.dash{stroke:#B4B2A9}.bg{fill:#FFFFFF}.grid{stroke:#E4E2DA}.b-purple{fill:#EEEDFE;stroke:#534AB7}.k-purple{fill:#3C3489}.s-purple{fill:#534AB7}.b-teal{fill:#E1F5EE;stroke:#0F6E56}.k-teal{fill:#085041}.s-teal{fill:#0F6E56}.b-gray{fill:#F1EFE8;stroke:#5F5E5A}.k-gray{fill:#444441}.s-gray{fill:#5F5E5A}.b-amber{fill:#FAEEDA;stroke:#854F0B}.k-amber{fill:#633806}.s-amber{fill:#854F0B}.b-coral{fill:#FAECE7;stroke:#993C1D}.k-coral{fill:#712B13}.s-coral{fill:#993C1D}.b-red{fill:#FCEBEB;stroke:#A32D2D}.k-red{fill:#791F1F}.s-red{fill:#A32D2D}.b-green{fill:#EAF3DE;stroke:#3B6D11}.k-green{fill:#27500A}.s-green{fill:#3B6D11}@media (prefers-color-scheme:dark){.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.tx{fill:#8A887F}.ln{stroke:#B4B2A9}.dash{stroke:#5F5E5A}.bg{fill:#1F1E1C}.grid{stroke:#34332F}.b-purple{fill:#3C3489;stroke:#AFA9EC}.k-purple{fill:#EEEDFE}.s-purple{fill:#CECBF6}.b-teal{fill:#085041;stroke:#5DCAA5}.k-teal{fill:#E1F5EE}.s-teal{fill:#9FE1CB}.b-gray{fill:#444441;stroke:#B4B2A9}.k-gray{fill:#F1EFE8}.s-gray{fill:#D3D1C7}.b-amber{fill:#633806;stroke:#EF9F27}.k-amber{fill:#FAEEDA}.s-amber{fill:#FAC775}.b-coral{fill:#712B13;stroke:#F0997B}.k-coral{fill:#FAECE7}.s-coral{fill:#F5C4B3}.b-red{fill:#791F1F;stroke:#F09595}.k-red{fill:#FCEBEB}.s-red{fill:#F7C1C1}.b-green{fill:#27500A;stroke:#97C459}.k-green{fill:#EAF3DE}.s-green{fill:#C0DD97}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round