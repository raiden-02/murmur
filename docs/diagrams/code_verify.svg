" width="75.0" height="24.0" rx="3" stroke-width="0.6"/><text class="tx k-teal mono" x="284.5" y="282.0" text-anchor="middle" dominant-baseline="central">␣some</text><rect class="b-teal" x="328.0" y="270.0" width="75.0" height="24.0" rx="3" stroke-width="0.6"/><text class="tx k-teal mono" x="365.5" y="282.0" text-anchor="middle" dominant-baseline="central">␣of</text><rect class="b-teal" x="409.0" y="270.0" width="75.0" height="24.0" rx="3" stroke-width="0.6"/><text class="tx k-teal mono" x="446.5" y="282.0" text-anchor="middle" dominant-baseline="central">␣the</text><rect class="b-gray" x="490.0" y="270.0" width="75.0" height="24.0" rx="3" stroke-width="0.6" stroke-dasharray="3 2"/><line x1="494.0" y1="282.0" x2="561.0" y2="282.0" stroke="#D94848" stroke-width="1.2"/><text class="ts" x="24.0" y="318.0" text-anchor="start" dominant-baseline="central">“␣most” (dashed) stands in for the 4th guess: the lab records only that it was not “␣best”.</text><text class="ts" x="24.0" y="336.0" text-anchor="start" dominant-baseline="central">Teal: the draft's guesses, and the cache. Amber: what Accept appended. In this run 26% of guesses were kept.</text><text class="tx mono" x="24.0" y="362.0" text-anchor="start" dominant-baseline="central">lines 336–339</text><text class="tx" x="130.0" y="362.0" text-anchor="start" dominant-baseline="central">Speculate: step_tokens = the newest token, then the guesses</text><text class="tx mono" x="24.0" y="379.0" text-anchor="start" dominant-baseline="central">line 194</text><text class="tx" x="130.0" y="379.0" text-anchor="start" dominant-baseline="central">Entries: each step token is its own decode row with its own logits</text><text class="tx mono" x="24.0" y="396.0" text-anchor="start" dominant-baseline="central">lines 352–355</text><text class="tx" x="130.0" y="396.0" text-anchor="start" dominant-baseline="central">Verify: count the guesses that equal the model's token at their position</text><text class="tx mono" x="24.0" y="413.0" text-anchor="start" dominant-baseline="central">lines 364–366</text><text class="tx" x="130.0" y="413.0" text-anchor="start" dominant-baseline="central">Accept each kept guess, then checked[accepted], the model's own</text><text class="tx mono" x="24.0" y="430.0" text-anchor="start" dominant-baseline="central">lines 369–375</text><text class="tx" x="130.0" y="430.0" text-anchor="start" dominant-baseline="central">keep the cached positions c.tokens still holds; drop the rest</text></svg>
