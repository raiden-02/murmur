ple mono" x="527.5" y="136.0" text-anchor="middle" dominant-baseline="central">␣best</text><text class="tx mono" x="527.5" y="157.0" text-anchor="middle" dominant-baseline="central">[3]</text><rect class="b-gray" x="571.0" y="124.0" width="75.0" height="24.0" rx="3" stroke-width="0.6"/><text class="tx k-gray" x="608.5" y="136.0" text-anchor="middle" dominant-baseline="central">not read</text><text class="tx mono" x="608.5" y="157.0" text-anchor="middle" dominant-baseline="central">[4]</text><text class="tx mono" x="608.5" y="113.0" text-anchor="middle" dominant-baseline="central">accepted = 3</text><text class="tx mono" x="24.0" y="204.0" text-anchor="start" dominant-baseline="central">c.tokens</text><rect class="b-gray" x="166.0" y="192.0" width="75.0" height="24.0" rx="3" stroke-width="0.6"/><text class="tx k-gray mono" x="203.5" y="204.0" text-anchor="middle" dominant-baseline="central">␣up</text><line x1="284.5" y1="162.0" x2="284.5" y2="189.0" stroke="#E0921C" stroke-width="1.1" marker-end="url(#a)"/><rect class="b-amber" x="247.0" y="192.0" width="75.0" height="24.0" rx="3" stroke-width="0.6"/><text class="tx k-amber mono" x="284.5" y="204.0" text-anchor="middle" dominant-baseline="central">␣some</text><line x1="365.5" y1="162.0" x2="365.5" y2="189.0" stroke="#E0921C" stroke-width="1.1" marker-end="url(#a)"/><rect class="b-amber" x="328.0" y="192.0" width="75.0" height="24.0" rx="3" stroke-width="0.6"/><text class="tx k-amber mono" x="365.5" y="204.0" text-anchor="middle" dominant-baseline="central">␣of</text><line x1="446.5" y1="162.0" x2="446.5" y2="189.0" stroke="#E0921C" stroke-width="1.1" marker-end="url(#a)"/><rect class="b-amber" x="409.0" y="192.0" width="75.0" height="24.0" rx="3" stroke-width="0.6"/><text class="tx k-amber mono" x="446.5" y="204.0" text-anchor="middle" dominant-baseline="central">␣the</text><line x1="527.5" y1="162.0" x2="527.5" y2="189.0" stroke="#E0921C" stroke-width="1.1" marker-end="url(#a)"/><rect class="b-amber" x="490.0" y="19