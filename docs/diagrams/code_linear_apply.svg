th="182.0" height="34.0" rx="3" stroke-width="0.6"/><text class="ts k-coral mono" x="559.0" y="147.0" text-anchor="middle" dominant-baseline="central">ApplyFp8TensorCores</text><text class="ts mono" x="84.0" y="185.0" text-anchor="end" dominant-baseline="central">INT4</text><rect class="b-gray" x="96.0" y="168.0" width="182.0" height="34.0" rx="3" stroke-width="0.6"/><text class="ts k-gray mono" x="187.0" y="185.0" text-anchor="middle" dominant-baseline="central">MatVec</text><rect class="b-teal" x="282.0" y="168.0" width="182.0" height="34.0" rx="3" stroke-width="0.6"/><text class="ts k-teal mono" x="373.0" y="185.0" text-anchor="middle" dominant-baseline="central">ApplyTensorCores</text><rect class="b-teal" x="468.0" y="168.0" width="182.0" height="34.0" rx="3" stroke-width="0.6"/><text class="ts k-teal mono" x="559.0" y="185.0" text-anchor="middle" dominant-baseline="central">ApplyTensorCores</text><line x1="466.0" y1="80.0" x2="466.0" y2="210.0" stroke="#E0921C" stroke-width="1.4" stroke-dasharray="4 3"/><text class="tx mono" x="466.0" y="220.0" text-anchor="middle" dominant-baseline="central">kGemmF16Rows = 48</text><text class="tx mono" x="84.0" y="70.0" text-anchor="end" dominant-baseline="central">Format()</text><text class="ts" x="24.0" y="246.0" text-anchor="start" dominant-baseline="central">The other MultiRowMath values (Transformer::SetMultiRowMath), same rows and formats:</text><text class="ts mono" x="24.0" y="268.0" text-anchor="start" dominant-baseline="central">"exact"</text><text class="tx mono" x="24.0" y="282.0" text-anchor="start" dominant-baseline="central">kExactFp32</text><rect class="b-gray" x="24.0" y="294.0" width="26.0" height="13.0" rx="3" stroke-width="0.6"/><rect class="b-green" x="52.0" y="294.0" width="26.0" height="13.0" rx="3" stroke-width="0.6"/><rect class="b-green" x="80.0" y="294.0" width="26.0" height="13.0" rx="3" stroke-width="0.6"/><rect class="b-gray" x="24.0" y="309.0" width="26.0" height="13.0" rx="3" stroke-width="0.6"