baseline="central">"cublas"</text><text class="tx mono" x="344.0" y="282.0" text-anchor="start" dominant-baseline="central">kCublasBf16</text><rect class="b-gray" x="344.0" y="294.0" width="26.0" height="13.0" rx="3" stroke-width="0.6"/><rect class="b-purple" x="372.0" y="294.0" width="26.0" height="13.0" rx="3" stroke-width="0.6"/><rect class="b-purple" x="400.0" y="294.0" width="26.0" height="13.0" rx="3" stroke-width="0.6"/><rect class="b-gray" x="344.0" y="309.0" width="26.0" height="13.0" rx="3" stroke-width="0.6"/><rect class="b-teal" x="372.0" y="309.0" width="26.0" height="13.0" rx="3" stroke-width="0.6"/><rect class="b-teal" x="400.0" y="309.0" width="26.0" height="13.0" rx="3" stroke-width="0.6"/><rect class="b-gray" x="344.0" y="324.0" width="26.0" height="13.0" rx="3" stroke-width="0.6"/><rect class="b-teal" x="372.0" y="324.0" width="26.0" height="13.0" rx="3" stroke-width="0.6"/><rect class="b-teal" x="400.0" y="324.0" width="26.0" height="13.0" rx="3" stroke-width="0.6"/><text class="ts mono" x="504.0" y="268.0" text-anchor="start" dominant-baseline="central">"fp8"</text><text class="tx mono" x="504.0" y="282.0" text-anchor="start" dominant-baseline="central">kFp8TensorCores</text><rect class="b-gray" x="504.0" y="294.0" width="26.0" height="13.0" rx="3" stroke-width="0.6"/><rect class="b-teal" x="532.0" y="294.0" width="26.0" height="13.0" rx="3" stroke-width="0.6"/><rect class="b-teal" x="560.0" y="294.0" width="26.0" height="13.0" rx="3" stroke-width="0.6"/><rect class="b-gray" x="504.0" y="309.0" width="26.0" height="13.0" rx="3" stroke-width="0.6"/><rect class="b-coral" x="532.0" y="309.0" width="26.0" height="13.0" rx="3" stroke-width="0.6"/><rect class="b-coral" x="560.0" y="309.0" width="26.0" height="13.0" rx="3" stroke-width="0.6"/><rect class="b-gray" x="504.0" y="324.0" width="26.0" height="13.0" rx="3" stroke-width="0.6"/><rect class="b-teal" x="532.0" y="324.0" width="26.0" height="13.0" rx="3" stroke-width="0.6"/><rect class="b-teal" x="560.0" y="324.0" width="26.0" height="13.0" rx="3" stroke-width="0.6"/><text class="tx" x="24.0" y="366.0" text-anchor="start" dominant-baseline="central">Exact math decodes the whole matrix into widened_, sized for the largest layer matrix; the 151,936 × 1,536</text><text class="tx" x="24.0" y="381.0" text-anchor="start" dominant-baseline="central">vocabulary projection does not fit, so with more than one row it runs MatVec once per row.</text><rect class="b-gray" x="24.0" y="408.0" width="150.0" height="18.0" rx="3" stroke-width="0.6"/><text class="tx k-gray mono" x="99.0" y="417.0" text-anchor="middle" dominant-baseline="central">MatVec</text><text class="tx" x="184.0" y="417.0" text-anchor="start" dominant-baseline="central">once per row: the fused matrix-vector kernel</text><rect class="b-teal" x="24.0" y="430.0" width="150.0" height="18.0" rx="3" stroke-width="0.6"/><text class="tx k-teal mono" x="99.0" y="439.0" text-anchor="middle" dominant-baseline="central">ApplyTensorCores</text><text class="tx" x="184.0" y="439.0" text-anchor="start" dominant-baseline="central">RmsNormToF16 or ConvertF32ToF16, then GemmF16 with the epilogue fused</text><rect class="b-purple" x="24.0" y="452.0" width="150.0" height="18.0" rx="3" stroke-width="0.6"/><text class="tx k-purple mono" x="99.0" y="461.0" text-anchor="middle" dominant-baseline="central">ApplyCublasBf16</text><text class="tx" x="184.0" y="461.0" text-anchor="start" dominant-baseline="central">RmsNormToBf16 or ConvertF32ToBf16, blas_.LinearBf16, then Finish</text><rect class="b-coral" x="24.0" y="474.0" width="150.0" height="18.0" rx="3" stroke-width="0.6"/><text class="tx k-coral mono" x="99.0" y="483.0" text-anchor="middle" dominant-baseline="central">ApplyFp8TensorCores</text><text class="tx" x="184.0" y="483.0" text-anchor="start" dominant-baseline="central">QuantizeRowsToFp8, blas_.LinearFp8, then FinishFp8Products</text><rect class="b-green" x="24.0" y="496.0" width="150.0" height="18.0" rx="3" stroke-width="0.6"/><text class="tx k-green mono" x="99.0" y="505.0" text-anchor="middle" dominant-baseline="central">ApplyExact</text><text class="tx" x="184.0" y="505.0" text-anchor="start" dominant-baseline="central">RmsNorm, DequantizeRows (whole matrix to FP32), blas_.Linear (SGEMM), Finish</text><text class="tx mono" x="24.0" y="534.0" text-anchor="start" dominant-baseline="central">lines 81–84</text><text class="tx" x="130.0" y="534.0" text-anchor="start" dominant-baseline="central">one row (or a matrix the multi-row path can't take): MatVec for each row</text><text class="tx mono" x="24.0" y="551.0" text-anchor="start" dominant-baseline="central">lines 99–107</text><text class="tx" x="130.0" y="551.0" text-anchor="start" dominant-baseline="central">then, in order: exact, cuBLAS for BF16, FP8 tensor cores for FP8, else GemmF16</text><text class="tx mono" x="24.0" y="568.0" text-anchor="start" dominant-baseline="central">lines 138–141</text><text class="tx" x="130.0" y="568.0" text-anchor="start" dominant-baseline="central">UsesCublasBf16: BF16 weights, and math "cublas" or "fast" with more than 48 rows</text></svg>
