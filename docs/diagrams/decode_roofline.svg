<svg xmlns="http://www.w3.org/2000/svg" width="680" height="382" viewBox="0 0 680 382" role="img"><title>Roofline of the decode kernels</title><style>text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.th{font-size:14px;font-weight:600;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.tx{font-size:11px;fill:#888780}.mono{font-family:Consolas,'SF Mono',Menlo,monospace}.ln{stroke:#888780}.dash{stroke:#B4B2A9}.bg{fill:#FFFFFF}.grid{stroke:#E4E2DA}.b-purple{fill:#EEEDFE;stroke:#534AB7}.k-purple{fill:#3C3489}.s-purple{fill:#534AB7}.b-teal{fill:#E1F5EE;stroke:#0F6E56}.k-teal{fill:#085041}.s-teal{fill:#0F6E56}.b-gray{fill:#F1EFE8;stroke:#5F5E5A}.k-gray{fill:#444441}.s-gray{fill:#5F5E5A}.b-amber{fill:#FAEEDA;stroke:#854F0B}.k-amber{fill:#633806}.s-amber{fill:#854F0B}.b-coral{fill:#FAECE7;stroke:#993C1D}.k-coral{fill:#712B13}.s-coral{fill:#993C1D}.b-red{fill:#FCEBEB;stroke:#A32D2D}.k-red{fill:#791F1F}.s-red{fill:#A32D2D}.b-green{fill:#EAF3DE;stroke:#3B6D11}.k-green{fill:#27500A}.s-green{fill:#3B6D11}@media (prefers-color-scheme:dark){.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.tx{fill:#8A887F}.ln{stroke:#B4B2A9}.dash{stroke:#5F5E5A}.bg{fill:#1F1E1C}.grid{stroke:#34332F}.b-purple{fill:#3C3489;stroke:#AFA9EC}.k-purple{fill:#EEEDFE}.s-purple{fill:#CECBF6}.b-teal{fill:#085041;stroke:#5DCAA5}.k-teal{fill:#E1F5EE}.s-teal{fill:#9FE1CB}.b-gray{fill:#444441;stroke:#B4B2A9}.k-gray{fill:#F1EFE8}.s-gray{fill:#D3D1C7}.b-amber{fill:#633806;stroke:#EF9F27}.k-amber{fill:#FAEEDA}.s-amber{fill:#FAC775}.b-coral{fill:#712B13;stroke:#F0997B}.k-coral{fill:#FAECE7}.s-coral{fill:#F5C4B3}.b-red{fill:#791F1F;stroke:#F09595}.k-red{fill:#FCEBEB}.s-red{fill:#F7C1C1}.b-green{fill:#27500A;stroke:#97C459}.k-green{fill:#EAF3DE}.s-green{fill:#C0DD97}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" x="0" y="0" width="680" height="382" rx="12"/><text class="th" x="40.0" y="18.0" text-anchor="start" dominant-baseline="central">Roofline of the decode kernels: all far left of the ridge, so bytes are what matter</text><rect x="110" y="52" width="490" height="220" fill="none" class="dash" stroke-width="0.8"/><text class="ts" x="110.0" y="286.0" text-anchor="middle" dominant-baseline="central">0.1</text><text class="ts" x="232.5" y="286.0" text-anchor="middle" dominant-baseline="central">1</text><text class="ts" x="355.0" y="286.0" text-anchor="middle" dominant-baseline="central">10</text><text class="ts" x="477.5" y="286.0" text-anchor="middle" dominant-baseline="central">100</text><text class="ts" x="600.0" y="286.0" text-anchor="middle" dominant-baseline="central">1000</text><text class="ts" x="102.0" y="272.0" text-anchor="end" dominant-baseline="central">0.01</text><text class="ts" x="102.0" y="217.0" text-anchor="end" dominant-baseline="central">0.1</text><text class="ts" x="102.0" y="162.0" text-anchor="end" dominant-baseline="central">1</text><text class="ts" x="102.0" y="107.0" text-anchor="end" dominant-baseline="central">10</text><text class="ts" x="102.0" y="52.0" text-anchor="end" dominant-baseline="central">100</text><text class="ts" x="355.0" y="304.0" text-anchor="middle" dominant-baseline="central">FLOPs per byte read (log)</text><text class="ts" x="102.0" y="40.0" text-anchor="end" dominant-baseline="central">TFLOP/s</text><line x1="110.0" y1="224.3" x2="459.2" y2="67.5" stroke="#378ADD" stroke-width="2"/><line x1="459.2" y1="67.5" x2="600.0" y2="67.5" stroke="#D85A30" stroke-width="2"/><text class="ts" x="459.2" y="83.5" text-anchor="middle" dominant-baseline="central">ridge ≈ 71</text><circle cx="232.5" cy="171.8" r="5" class="b-amber" stroke-width="1"/><text class="ts" x="242.5" y="159.8" text-anchor="start" dominant-baseline="central">gate/up, down, lm_head (~1 FLOP/B, 89–94%)</text><circle cx="232.5" cy="179.9" r="5" class="b-amber" stroke-width="1"/><text class="ts" x="242.5" y="189.9" text-anchor="start" dominant-baseline="central">qkv, o_proj (~65%)</text><circle cx="290.9" cy="172.3" r="5" class="b-amber" stroke-width="1"/><text class="ts" x="300.9" y="172.3" text-anchor="start" dominant-baseline="central">split attention (~3 FLOP/B, 29%)</text><text class="ts" x="40.0" y="328.0" text-anchor="start" dominant-baseline="central">Batch-1 decode does ~1 multiply-add per weight loaded: 2 FLOPs per 2-byte BF16 weight. Its ceiling</text><text class="ts" x="40.0" y="346.0" text-anchor="start" dominant-baseline="central">is the memory roof (blue), and the gap between a dot and that roof is lost bandwidth. Batching many</text><text class="ts" x="40.0" y="364.0" text-anchor="start" dominant-baseline="central">conversations reuses each weight for several tokens and moves the dots to the right.</text></svg>
