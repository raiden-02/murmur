ln" stroke-width="1.4" marker-end="url(#a)"/><path d="M282.0 78 L282.0 110" fill="none" fill-opacity="1.0" class="ln" stroke-width="1.4" marker-end="url(#a)"/><path d="M398.0 78 L398.0 110" fill="none" fill-opacity="1.0" class="ln" stroke-width="1.4" marker-end="url(#a)"/><path d="M514.0 78 L514.0 110" fill="none" fill-opacity="1.0" class="ln" stroke-width="1.4" marker-end="url(#a)"/><text class="ts" x="24.0" y="128.0" text-anchor="start" dominant-baseline="central">coarser</text><rect class="b-teal" x="144.0" y="112.0" width="44.0" height="32.0" rx="5" stroke-width="0.6"/><text class="th k-teal" x="166.0" y="128.0" text-anchor="middle" dominant-baseline="central">3</text><rect class="b-teal" x="260.0" y="112.0" width="44.0" height="32.0" rx="5" stroke-width="0.6"/><text class="th k-teal" x="282.0" y="128.0" text-anchor="middle" dominant-baseline="central">7</text><rect class="b-teal" x="376.0" y="112.0" width="44.0" height="32.0" rx="5" stroke-width="0.6"/><text class="th k-teal" x="398.0" y="128.0" text-anchor="middle" dominant-baseline="central">11</text><rect class="b-teal" x="492.0" y="112.0" width="44.0" height="32.0" rx="5" stroke-width="0.6"/><text class="th k-teal" x="514.0" y="128.0" text-anchor="middle" dominant-baseline="central">15</text><path d="M224.0 146 L224.0 178" fill="none" fill-opacity="1.0" class="ln" stroke-width="1.4" marker-end="url(#a)"/><path d="M456.0 146 L456.0 178" fill="none" fill-opacity="1.0" class="ln" stroke-width="1.4" marker-end="url(#a)"/><text class="ts" x="24.0" y="196.0" text-anchor="start" dominant-baseline="central">coarser</text><rect class="b-teal" x="202.0" y="180.0" width="44.0" height="32.0" rx="5" stroke-width="0.6"/><text class="th k-teal" x="224.0" y="196.0" text-anchor="middle" dominant-baseline="central">10</text><rect class="b-teal" x="434.0" y="180.0" width="44.0" height="32.0" rx="5" stroke-width="0.6"/><text class="th k-teal" x="456.0" y="196.0" text-anchor="middle" dominant-baseline="central">26</text><path d="M340.0 214 L340.0 246" fill="none" fill-opacity="1.0" class="ln" stroke-width="1.4" marker-end="url(#a)"/><text class="ts" x="24.0" y="264.0" text-anchor="start" dominant-baseline="central">coarsest</text><rect class="b-amber" x="318.0" y="248.0" width="44.0" height="32.0" rx="5" stroke-width="0.6"/><text class="th k-amber" x="340.0" y="264.0" text-anchor="middle" dominant-baseline="central">36</text><text class="ts" x="40.0" y="294.0" text-anchor="start" dominant-baseline="central">Each step adds neighbours and keeps half as many. 1+2 is 3, and the pairs combine down to 36.</text><text class="ts" x="40.0" y="312.0" text-anchor="start" dominant-baseline="central">Coarsening is that first add inside one thread: 16 values become 1, then the block's tree runs.</text><text class="ts" x="40.0" y="330.0" text-anchor="start" dominant-baseline="central">One real pass keeps a single sum per block, so 64 Mi values become 16,384, then 4, then 1.</text></svg>
