<svg xmlns="http://www.w3.org/2000/svg" width="680" height="390.0" viewBox="0 0 680 390.0" role="img"><title>A prompt's attention in tiles</title><style>text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.th{font-size:14px;font-weight:600;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.tx{font-size:11px;fill:#888780}.mono{font-family:Consolas,'SF Mono',Menlo,monospace}.ln{stroke:#888780}.dash{stroke:#B4B2A9}.bg{fill:#FFFFFF}.grid{stroke:#E4E2DA}.b-purple{fill:#EEEDFE;stroke:#534AB7}.k-purple{fill:#3C3489}.s-purple{fill:#534AB7}.b-teal{fill:#E1F5EE;stroke:#0F6E56}.k-teal{fill:#085041}.s-teal{fill:#0F6E56}.b-gray{fill:#F1EFE8;stroke:#5F5E5A}.k-gray{fill:#444441}.s-gray{fill:#5F5E5A}.b-amber{fill:#FAEEDA;stroke:#854F0B}.k-amber{fill:#633806}.s-amber{fill:#854F0B}.b-coral{fill:#FAECE7;stroke:#993C1D}.k-coral{fill:#712B13}.s-coral{fill:#993C1D}.b-red{fill:#FCEBEB;stroke:#A32D2D}.k-red{fill:#791F1F}.s-red{fill:#A32D2D}.b-green{fill:#EAF3DE;stroke:#3B6D11}.k-green{fill:#27500A}.s-green{fill:#3B6D11}@media (prefers-color-scheme:dark){.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.tx{fill:#8A887F}.ln{stroke:#B4B2A9}.dash{stroke:#5F5E5A}.bg{fill:#1F1E1C}.grid{stroke:#34332F}.b-purple{fill:#3C3489;stroke:#AFA9EC}.k-purple{fill:#EEEDFE}.s-purple{fill:#CECBF6}.b-teal{fill:#085041;stroke:#5DCAA5}.k-teal{fill:#E1F5EE}.s-teal{fill:#9FE1CB}.b-gray{fill:#444441;stroke:#B4B2A9}.k-gray{fill:#F1EFE8}.s-gray{fill:#D3D1C7}.b-amber{fill:#633806;stroke:#EF9F27}.k-amber{fill:#FAEEDA}.s-amber{fill:#FAC775}.b-coral{fill:#712B13;stroke:#F0997B}.k-coral{fill:#FAECE7}.s-coral{fill:#F5C4B3}.b-red{fill:#791F1F;stroke:#F09595}.k-red{fill:#FCEBEB}.s-red{fill:#F7C1C1}.b-green{fill:#27500A;stroke:#97C459}.k-green{fill:#EAF3DE}.s-green{fill:#C0DD97}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" x="0" y="0" width="680" height="390.0" rx="12"/><text class="th" x="40.0" y="22.0" text-anchor="start" dominant-baseline="central">One 377-token prompt: which query rows meet which keys</text><rect x="60.6" y="60.6" width="49.7" height="49.7" rx="0" fill="#5E9E25" fill-opacity="0.550"/><rect x="60.6" y="111.5" width="49.7" height="49.7" rx="0" fill="#1D9E75" fill-opacity="0.800"/><rect x="111.5" y="111.5" width="49.7" height="49.7" rx="0" fill="#5E9E25" fill-opacity="0.550"/><rect x="60.6" y="162.5" width="49.7" height="49.7" rx="0" fill="#1D9E75" fill-opacity="0.800"/><rect x="111.5" y="162.5" width="49.7" height="49.7" rx="0" fill="#1D9E75" fill-opacity="0.800"/><rect x="162.5" y="162.5" width="49.7" height="49.7" rx="0" fill="#5E9E25" fill-opacity="0.550"/><rect x="60.6" y="213.4" width="49.7" height="49.7" rx="0" fill="#1D9E75" fill-opacity="0.800"/><rect x="111.5" y="213.4" width="49.7" height="49.7" rx="0" fill="#1D9E75" fill-opacity="0.800"/><rect x="162.5" y="213.4" width="49.7" height="49.7" rx="0" fill="#1D9E75" fill-opacity="0.800"/><rect x="213.4" y="213.4" width="49.7" height="49.7" rx="0" fill="#5E9E25" fill-opacity="0.550"/><rect x="60.6" y="264.3" width="49.7" height="49.7" rx="0" fill="#1D9E75" fill-opacity="0.800"/><rect x="111.5" y="264.3" width="49.7" height="49.7" rx="0" fill="#1D9E75" fill-opacity="0.800"/><rect x="162.5" y="264.3" width="49.7" height="49.7" rx="0" fill="#1D9E75" fill-opacity="0.800"/><rect x="213.4" y="264.3" width="49.7" height="49.7" rx="0" fill="#1D9E75" fill-opacity="0.800"/><rect x="264.3" y="264.3" width="49.7" height="49.7" rx="0" fill="#5E9E25" fill-opacity="0.550"/><rect x="60.6" y="315.2" width="49.7" height="44.2" rx="0" fill="#1D9E75" fill-opacity="0.800"/><rect x="111.5" y="315.2" width="49.7" height="44.2" rx="0" fill="#1D9E75" fill-opacity="0.800"/><rect x="162.5" y="315.2" width="49.7" height="44.2" rx="0" fill="#1D9E75" fill-opacity="0.800"/><rect x="213.4" y="315.2" width="49.7" height="44.2" rx="0" fill="#1D9E75" fill-opacity="0.800"/><rect x="264.3" y="315.2" width="49.7" height="44.2" rx="0" fill="#1D9E75" fill-opacity="0.800"/><rect x="315.2" y="315.2" width="44.2" height="44.2" rx="0" fill="#5E9E25" fill-opacity="0.550"/><path d="M60 60 L360.0 360.0" fill="none" fill-opacity="1.0" stroke="#D94848" stroke-width="1.4"/><text class="tx" x="210.0" y="48.0" text-anchor="middle" dominant-baseline="central">keys →</text><text class="tx" x="50.0" y="210.0" text-anchor="end" dominant-baseline="central">rows ↓</text><text class="ts" x="400.0" y="80.0" text-anchor="start" dominant-baseline="central">21 of 36 tiles of 64 x 64 are computed;</text><text class="ts" x="400.0" y="98.0" text-anchor="start" dominant-baseline="central">the rest (above the diagonal) are never loaded.</text><rect x="400.0" y="122.0" width="12.0" height="12.0" rx="0" fill="#1D9E75" fill-opacity="0.800"/><text class="tx" x="418.0" y="128.0" text-anchor="start" dominant-baseline="central">every key visible</text><rect x="400.0" y="142.0" width="12.0" height="12.0" rx="0" fill="#5E9E25" fill-opacity="0.550"/><text class="tx" x="418.0" y="148.0" text-anchor="start" dominant-baseline="central">on the diagonal: masked inside</text><text class="ts" x="400.0" y="186.0" text-anchor="start" dominant-baseline="central">Each key/value tile is loaded once for 64 rows,</text><text class="ts" x="400.0" y="204.0" text-anchor="start" dominant-baseline="central">and its products run on tensor cores.</text><text class="ts" x="400.0" y="240.0" text-anchor="start" dominant-baseline="central">Keys and values read, all 12 heads:</text><text class="tx" x="400.0" y="258.0" text-anchor="start" dominant-baseline="central">one row at a time: 855,036 key reads</text><text class="tx" x="400.0" y="274.0" text-anchor="start" dominant-baseline="central">64-row tiles: 16,128 (53x fewer)</text></svg>
