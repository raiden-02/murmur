xt><text class="ts" x="360.0" y="284.0" text-anchor="middle" dominant-baseline="central" font-family="Consolas,monospace">␣of</text><text class="ts" x="490.0" y="284.0" text-anchor="middle" dominant-baseline="central" font-family="Consolas,monospace">␣France</text><text class="ts" x="620.0" y="284.0" text-anchor="middle" dominant-baseline="central" font-family="Consolas,monospace">␣is</text><text class="ts" x="40.0" y="308.0" text-anchor="start" dominant-baseline="central">A low score falls to about 0. The high one keeps most of the row. The five weights add to 1.</text></svg>
