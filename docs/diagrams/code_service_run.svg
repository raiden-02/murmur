<svg xmlns="http://www.w3.org/2000/svg" width="680" height="441" viewBox="0 0 680 441" role="img"><title>InferenceService::Run on a time axis</title><style>text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.th{font-size:14px;font-weight:600;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.tx{font-size:11px;fill:#888780}.mono{font-family:Consolas,'SF Mono',Menlo,monospace}.ln{stroke:#888780}.dash{stroke:#B4B2A9}.bg{fill:#FFFFFF}.grid{stroke:#E4E2DA}.b-purple{fill:#EEEDFE;stroke:#534AB7}.k-purple{fill:#3C3489}.s-purple{fill:#534AB7}.b-teal{fill:#E1F5EE;stroke:#0F6E56}.k-teal{fill:#085041}.s-teal{fill:#0F6E56}.b-gray{fill:#F1EFE8;stroke:#5F5E5A}.k-gray{fill:#444441}.s-gray{fill:#5F5E5A}.b-amber{fill:#FAEEDA;stroke:#854F0B}.k-amber{fill:#633806}.s-amber{fill:#854F0B}.b-coral{fill:#FAECE7;stroke:#993C1D}.k-coral{fill:#712B13}.s-coral{fill:#993C1D}.b-red{fill:#FCEBEB;stroke:#A32D2D}.k-red{fill:#791F1F}.s-red{fill:#A32D2D}.b-green{fill:#EAF3DE;stroke:#3B6D11}.k-green{fill:#27500A}.s-green{fill:#3B6D11}@media (prefers-color-scheme:dark){.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.tx{fill:#8A887F}.ln{stroke:#B4B2A9}.dash{stroke:#5F5E5A}.bg{fill:#1F1E1C}.grid{stroke:#34332F}.b-purple{fill:#3C3489;stroke:#AFA9EC}.k-purple{fill:#EEEDFE}.s-purple{fill:#CECBF6}.b-teal{fill:#085041;stroke:#5DCAA5}.k-teal{fill:#E1F5EE}.s-teal{fill:#9FE1CB}.b-gray{fill:#444441;stroke:#B4B2A9}.k-gray{fill:#F1EFE8}.s-gray{fill:#D3D1C7}.b-amber{fill:#633806;stroke:#EF9F27}.k-amber{fill:#FAEEDA}.s-amber{fill:#FAC775}.b-coral{fill:#712B13;stroke:#F0997B}.k-coral{fill:#FAECE7}.s-coral{fill:#F5C4B3}.b-red{fill:#791F1F;stroke:#F09595}.k-red{fill:#FCEBEB}.s-red{fill:#F7C1C1}.b-green{fill:#27500A;stroke:#97C459}.k-green{fill:#EAF3DE}.s-green{fill:#C0DD97}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" x="0" y="0" width="680" height="441" rx="12"/><text class="th" x="24.0" y="22.0" text-anchor="start" dominant-baseline="central">InferenceService::Run: the worker thread and the game's calls on one time axis</text><text class="ts" x="24.0" y="97.0" text-anchor="start" dominant-baseline="central">game thread</text><text class="ts" x="24.0" y="199.0" text-anchor="start" dominant-baseline="central">worker: Run()</text><rect class="b-gray" x="131.0" y="84.0" width="114.9" height="26.0" rx="3" stroke-width="0.6"/><rect x="132.1" y="81.0" width="3.2" height="32.0" rx="1" fill="#E0921C" fill-opacity="1.000"/><rect class="b-gray" x="247.9" y="84.0" width="114.9" height="26.0" rx="3" stroke-width="0.6"/><rect x="249.0" y="81.0" width="3.2" height="32.0" rx="1" fill="#E0921C" fill-opacity="1.000"/><rect class="b-gray" x="364.8" y="84.0" width="114.9" height="26.0" rx="3" stroke-width="0.6"/><rect x="365.9" y="81.0" width="3.2" height="32.0" rx="1" fill="#E0921C" fill-opacity="1.000"/><rect class="b-gray" x="481.7" y="84.0" width="114.9" height="26.0" rx="3" stroke-width="0.6"/><rect x="482.8" y="81.0" width="3.2" height="32.0" rx="1" fill="#E0921C" fill-opacity="1.000"/><rect class="b-gray" x="598.6" y="84.0" width="56.4" height="26.0" rx="3" stroke-width="0.6"/><rect x="599.7" y="81.0" width="3.2" height="32.0" rx="1" fill="#E0921C" fill-opacity="1.000"/><text class="tx mono" x="486.7" y="70.0" text-anchor="start" dominant-baseline="central">TakeEvents, Stats</text><rect x="238.7" y="81.0" width="3.2" height="32.0" rx="1" fill="#E0921C" fill-opacity="1.000"/><text class="tx mono" x="244.7" y="70.0" text-anchor="start" dominant-baseline="central">Open(Mei)</text><rect x="326.4" y="81.0" width="3.2" height="32.0" rx="1" fill="#E0921C" fill-opacity="1.000"/><text class="tx mono" x="332.4" y="70.0" text-anchor="start" dominant-baseline="central">Ask(Mei)</text><rect x="396.5" y="81.0" width="3.2" height="32.0" rx="1" fill="#E0921C" fill-opacity="1.000"/><text class="tx mono" x="402.5" y="70.0" text-anchor="start" dominant-baseline="central">Ask(Kenji)</text><line x1="130.0" y1="206.0" x2="238.7" y2="206.0" stroke="#8A887F" stroke-width="1.2" stroke-dasharray="4 3"/><text class="tx mono" x="134.0" y="194.0" text-anchor="start" dominant-baseline="central">work_ready_.wait</text><rect x="238.7" y="183.0" width="3.2" height="32.0" rx="1" fill="#E0921C" fill-opacity="1.000"/><text class="tx mono" x="238.7" y="226.0" text-anchor="start" dominant-baseline="central">[kOpen]</text><rect x="241.9" y="190.0" width="3.2" height="18.0" rx="0" fill="#7F77DD" fill-opacity="1.000"/><rect x="245.0" y="183.0" width="3.2" height="32.0" rx="1" fill="#E0921C" fill-opacity="1.000"/><line x1="248.2" y1="206.0" x2="326.4" y2="206.0" stroke="#8A887F" stroke-width="1.2" stroke-dasharray="4 3"/><text class="tx mono" x="252.2" y="194.0" text-anchor="start" dominant-baseline="central">wait again</text><rect x="326.4" y="183.0" width="3.2" height="32.0" rx="1" fill="#E0921C" fill-opacity="1.000"/><text class="tx mono" x="326.4" y="226.0" text-anchor="start" dominant-baseline="central">[kAsk]</text><rect x="329.5" y="190.0" width="3.2" height="18.0" rx="0" fill="#7F77DD" fill-opacity="1.000"/><rect class="b-teal" x="332.7" y="186.0" width="119.9" height="26.0" rx="3" stroke-width="0.6"/><text class="tx k-teal mono" x="392.6" y="199.0" text-anchor="middle" dominant-baseline="central">engine-&gt;Step()</text><rect x="452.6" y="183.0" width="3.2" height="32.0" rx="1" fill="#E0921C" fill-opacity="1.000"/><rect x="455.8" y="183.0" width="3.2" height="32.0" rx="1" fill="#E0921C" fill-opacity="1.000"/><text class="tx mono" x="455.8" y="226.0" text-anchor="start" dominant-baseline="central">[kAsk]</text><rect x="458.9" y="190.0" width="3.2" height="18.0" rx="0" fill="#7F77DD" fill-opacity="1.000"/><rect class="b-teal" x="462.1" y="186.0" width="119.9" height="26.0" rx="3" stroke-width="0.6"/><text class="tx k-teal mono" x="522.0" y="199.0" text-anchor="middle" dominant-baseline="central">engine-&gt;Step()</text><rect x="582.0" y="183.0" width="3.2" height="32.0" rx="1" fill="#E0921C" fill-opacity="1.000"/><rect x="585.2" y="183.0" width="3.2" height="32.0" rx="1" fill="#E0921C" fill-opacity="1.000"/><text class="tx mono" x="585.2" y="226.0" text-anchor="start" dominant-baseline="central">[ ]</text><rect class="b-teal" x="588.3" y="186.0" width="67.7" height="26.0" rx="3" stroke-width="0.6"/><line x1="240.7" y1="113.0" x2="240.7" y2="182.0" stroke="#D85A30" stroke-width="1.2" marker-end="url(#a)"/><line x1="328.4" y1="113.0" x2="328.4" y2="182.0" stroke="#D85A30" stroke-width="1.2" marker-end="url(#a)"/><line x1="398.5" y1="113.0" x2="398.5" y2="162.0" stroke="#D85A30" stroke-width="1.2" stroke-dasharray="4 3"/><line x1="398.5" y1="162.0" x2="455.8" y2="162.0" stroke="#8A887F" stroke-width="1.0" stroke-dasharray="4 3"/><line x1="455.8" y1="162.0" x2="455.8" y2="182.0" stroke="#8A887F" stroke-width="1.0" marker-end="url(#a)"/><text class="tx mono" x="392.5" y="162.0" text-anchor="end" dominant-baseline="central">commands_</text><line x1="453.6" y1="182.0" x2="483.7" y2="115.0" stroke="#1D9E75" stroke-width="1.0" marker-end="url(#a)"/><line x1="583.0" y1="182.0" x2="600.6" y2="115.0" stroke="#1D9E75" stroke-width="1.0" marker-end="url(#a)"/><text class="tx mono" x="478.6" y="148.0" text-anchor="start" dominant-baseline="central">events_</text><line x1="130.0" y1="242.0" x2="656.0" y2="242.0" class="ln" stroke-width="0.8"/><line x1="130.0" y1="242.0" x2="130.0" y2="246.0" class="ln" stroke-width="0.8"/><text class="tx" x="130.0" y="256.0" text-anchor="middle" dominant-baseline="central">0 ms</text><line x1="200.1" y1="242.0" x2="200.1" y2="246.0" class="ln" stroke-width="0.8"/><text class="tx" x="200.1" y="256.0" text-anchor="middle" dominant-baseline="central">10 ms</text><line x1="270.3" y1="242.0" x2="270.3" y2="246.0" class="ln" stroke-width="0.8"/><text class="tx" x="270.3" y="256.0" text-anchor="middle" dominant-baseline="central">20 ms</text><line x1="340.4" y1="242.0" x2="340.4" y2="246.0" class="ln" stroke-width="0.8"/><text class="tx" x="340.4" y="256.0" text-anchor="middle" dominant-baseline="central">30 ms</text><line x1="410.5" y1="242.0" x2="410.5" y2="246.0" class="ln" stroke-width="0.8"/><text class="tx" x="410.5" y="256.0" text-anchor="middle" dominant-baseline="central">40 ms</text><line x1="480.7" y1="242.0" x2="480.7" y2="246.0" class="ln" stroke-width="0.8"/><text class="tx" x="480.7" y="256.0" text-anchor="middle" dominant-baseline="central">50 ms</text><line x1="550.8" y1="242.0" x2="550.8" y2="246.0" class="ln" stroke-width="0.8"/><text class="tx" x="550.8" y="256.0" text-anchor="middle" dominant-baseline="central">60 ms</text><line x1="620.9" y1="242.0" x2="620.9" y2="246.0" class="ln" stroke-width="0.8"/><text class="tx" x="620.9" y="256.0" text-anchor="middle" dominant-baseline="central">70 ms</text><rect x="24.0" y="279.0" width="10.0" height="10.0" rx="2" fill="#E0921C" fill-opacity="0.900"/><text class="tx" x="40.0" y="284.0" text-anchor="start" dominant-baseline="central">holds mutex_ (drawn wider: each hold lasts microseconds)</text><rect x="349.2" y="279.0" width="10.0" height="10.0" rx="2" fill="#7F77DD" fill-opacity="0.900"/><text class="tx" x="365.2" y="284.0" text-anchor="start" dominant-baseline="central">Apply(command)</text><rect x="456.0" y="279.0" width="10.0" height="10.0" rx="2" fill="#8A887F" fill-opacity="0.400"/><text class="tx" x="472.0" y="284.0" text-anchor="start" dominant-baseline="central">frame</text><text class="ts" x="24.0" y="306.0" text-anchor="start" dominant-baseline="central">Frames 16.7 ms (60 fps); steps 17.1 ms, the median step of murmur-lab market (30 NPCs). The calls are an example.</text><text class="ts" x="24.0" y="324.0" text-anchor="start" dominant-baseline="central">The worker holds mutex_ only to swap commands_ out and to publish; Step() runs without it.</text><text class="tx mono" x="24.0" y="350.0" text-anchor="start" dominant-baseline="central">lines 100–102</text><text class="tx" x="130.0" y="350.0" text-anchor="start" dominant-baseline="central">Open, Ask, ... push a Command under the lock, then notify the worker</text><text class="tx mono" x="24.0" y="367.0" text-anchor="start" dominant-baseline="central">lines 149–153</text><text class="tx" x="130.0" y="367.0" text-anchor="start" dominant-baseline="central">sleep until a reply is running or a command is queued; swap all queued commands out</text><text class="tx mono" x="24.0" y="384.0" text-anchor="start" dominant-baseline="central">lines 155–162</text><text class="tx" x="130.0" y="384.0" text-anchor="start" dominant-baseline="central">apply them without the lock; with no reply running, go back to the wait</text><text class="tx mono" x="24.0" y="401.0" text-anchor="start" dominant-baseline="central">lines 166–177</text><text class="tx" x="130.0" y="401.0" text-anchor="start" dominant-baseline="central">run one step without the lock, then lock to append its events and copy the stats</text><text class="tx mono" x="24.0" y="418.0" text-anchor="start" dominant-baseline="central">line 88</text><text class="tx" x="130.0" y="418.0" text-anchor="start" dominant-baseline="central">the game's TakeEvents takes every event under the lock</text></svg>
