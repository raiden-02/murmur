89.7" y="381" width="10" height="27"/><text class="tx" x="594.7" y="394.5" text-anchor="middle" dominant-baseline="central">//</text><line x1="532.7" y1="394.5" x2="243.0" y2="394.5" stroke="#8A887F" stroke-width="1.2" marker-end="url(#a)"/><text class="tx" x="24.0" y="429.0" text-anchor="start" dominant-baseline="central">Grey: read. Amber: written. +=: the product is added onto hidden_, the residual stream.</text><text class="tx" x="24.0" y="443.0" text-anchor="start" dominant-baseline="central">RopeAndCacheQkv writes k and v at each row's row_cache row; attention reads the cache up to each slot's</text><text class="tx" x="24.0" y="457.0" text-anchor="start" dominant-baseline="central">context (41, 41, 41). 12 query heads and 2 key/value heads of 128 columns each.</text><text class="tx" x="24.0" y="471.0" text-anchor="start" dominant-baseline="central">With 25 rows (≤ 48) every linear_.Apply here runs ApplyTensorCores; SwiGLU runs in GemmF16's epilogue.</text><text class="tx mono" x="24.0" y="497.0" text-anchor="start" dominant-baseline="central">lines 439–449</text><text class="tx" x="130.0" y="497.0" text-anchor="start" dominant-baseline="central">1–2: q, k, v from the normalized residual; rotate, then cache k and v</text><text class="tx mono" x="24.0" y="514.0" text-anchor="start" dominant-baseline="central">lines 454–469</text><text class="tx" x="130.0" y="514.0" text-anchor="start" dominant-baseline="central">3–4: decode rows, then prompt rows from offset (CausalAttention in exact mode)</text><text class="tx mono" x="24.0" y="531.0" text-anchor="start" dominant-baseline="central">lines 474–475</text><text class="tx" x="130.0" y="531.0" text-anchor="start" dominant-baseline="central">5–6: each adds its product onto hidden_</text></svg>
