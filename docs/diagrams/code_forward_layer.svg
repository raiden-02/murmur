" width="64.0" height="25.0" rx="1" stroke-width="0.6"/><text class="tx k-amber mono" x="208.0" y="304.5" text-anchor="middle" dominant-baseline="central">+=</text><line x1="316.0" y1="292.0" x2="316.0" y2="317.0" class="ln" stroke-width="0.6"/><line x1="326.7" y1="292.0" x2="326.7" y2="317.0" class="ln" stroke-width="0.6"/><line x1="436.0" y1="292.0" x2="436.0" y2="317.0" class="ln" stroke-width="0.6"/><rect class="bg" x="589.7" y="291" width="10" height="27"/><text class="tx" x="594.7" y="304.5" text-anchor="middle" dominant-baseline="central">//</text><line x1="456.7" y1="304.5" x2="243.0" y2="304.5" stroke="#8A887F" stroke-width="1.2" marker-end="url(#a)"/><text class="ts mono" x="24.0" y="343.5" text-anchor="start" dominant-baseline="central">6 linear_.FeedForward</text><text class="tx" x="38.0" y="357.5" text-anchor="start" dominant-baseline="central">gate_up_proj, SwiGLU</text><rect class="b-gray" x="176.0" y="337.0" width="64.0" height="25.0" rx="1" stroke-width="0.6" fill-opacity="0.15" stroke-opacity="0.3"/><rect class="b-gray" x="252.0" y="337.0" width="85.3" height="25.0" rx="1" stroke-width="0.6" fill-opacity="0.15" stroke-opacity="0.3"/><rect class="b-gray" x="349.3" y="337.0" width="64.0" height="25.0" rx="1" stroke-width="0.6" fill-opacity="0.15" stroke-opacity="0.3"/><rect class="b-gray" x="425.3" y="337.0" width="21.3" height="25.0" rx="1" stroke-width="0.6" fill-opacity="0.15" stroke-opacity="0.3"/><rect class="b-gray" x="458.7" y="337.0" width="64.0" height="25.0" rx="1" stroke-width="0.6" fill-opacity="0.15" stroke-opacity="0.3"/><rect class="b-gray" x="534.7" y="337.0" width="120.0" height="25.0" rx="1" stroke-width="0.6" fill-opacity="0.15" stroke-opacity="0.3"/><rect class="b-gray" x="176.0" y="337.0" width="64.0" height="25.0" rx="1" stroke-width="0.6"/><rect class="b-amber" x="534.7" y="337.0" width="120.0" height="25.0" rx="1" stroke-width="0.6"/><line x1="316.0" y1="337.0" x2="316.0" y2="362.0" class="ln" stroke-width="0.6"/><line x1="326