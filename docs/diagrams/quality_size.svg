<svg xmlns="http://www.w3.org/2000/svg" width="680" height="368" viewBox="0 0 680 368" role="img"><title>Quality against size</title><style>text{font-family:-apple-system,'Segoe UI',Roboto,Helvetica,Arial,sans-serif}.th{font-size:14px;font-weight:600;fill:#2C2C2A}.ts{font-size:12px;fill:#5F5E5A}.tx{font-size:11px;fill:#888780}.mono{font-family:Consolas,'SF Mono',Menlo,monospace}.ln{stroke:#888780}.dash{stroke:#B4B2A9}.bg{fill:#FFFFFF}.grid{stroke:#E4E2DA}.b-purple{fill:#EEEDFE;stroke:#534AB7}.k-purple{fill:#3C3489}.s-purple{fill:#534AB7}.b-teal{fill:#E1F5EE;stroke:#0F6E56}.k-teal{fill:#085041}.s-teal{fill:#0F6E56}.b-gray{fill:#F1EFE8;stroke:#5F5E5A}.k-gray{fill:#444441}.s-gray{fill:#5F5E5A}.b-amber{fill:#FAEEDA;stroke:#854F0B}.k-amber{fill:#633806}.s-amber{fill:#854F0B}.b-coral{fill:#FAECE7;stroke:#993C1D}.k-coral{fill:#712B13}.s-coral{fill:#993C1D}.b-red{fill:#FCEBEB;stroke:#A32D2D}.k-red{fill:#791F1F}.s-red{fill:#A32D2D}.b-green{fill:#EAF3DE;stroke:#3B6D11}.k-green{fill:#27500A}.s-green{fill:#3B6D11}@media (prefers-color-scheme:dark){.th{fill:#F1EFE8}.ts{fill:#B4B2A9}.tx{fill:#8A887F}.ln{stroke:#B4B2A9}.dash{stroke:#5F5E5A}.bg{fill:#1F1E1C}.grid{stroke:#34332F}.b-purple{fill:#3C3489;stroke:#AFA9EC}.k-purple{fill:#EEEDFE}.s-purple{fill:#CECBF6}.b-teal{fill:#085041;stroke:#5DCAA5}.k-teal{fill:#E1F5EE}.s-teal{fill:#9FE1CB}.b-gray{fill:#444441;stroke:#B4B2A9}.k-gray{fill:#F1EFE8}.s-gray{fill:#D3D1C7}.b-amber{fill:#633806;stroke:#EF9F27}.k-amber{fill:#FAEEDA}.s-amber{fill:#FAC775}.b-coral{fill:#712B13;stroke:#F0997B}.k-coral{fill:#FAECE7}.s-coral{fill:#F5C4B3}.b-red{fill:#791F1F;stroke:#F09595}.k-red{fill:#FCEBEB}.s-red{fill:#F7C1C1}.b-green{fill:#27500A;stroke:#97C459}.k-green{fill:#EAF3DE}.s-green{fill:#C0DD97}}</style><defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" fill="none" stroke="context-stroke" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect class="bg" x="0" y="0" width="680" height="368" rx="12"/><text class="th" x="40.0" y="22.0" text-anchor="start" dominant-baseline="central">What each format costs: memory for the weights against drift from the original model</text><line x1="90.0" y1="245.6" x2="600.0" y2="245.6" class="ln" stroke-width="0.4" stroke-dasharray="4 3"/><text class="tx" x="84.0" y="245.6" text-anchor="end" dominant-baseline="central">10^-4</text><line x1="90.0" y1="196.7" x2="600.0" y2="196.7" class="ln" stroke-width="0.4" stroke-dasharray="4 3"/><text class="tx" x="84.0" y="196.7" text-anchor="end" dominant-baseline="central">10^-3</text><line x1="90.0" y1="147.8" x2="600.0" y2="147.8" class="ln" stroke-width="0.4" stroke-dasharray="4 3"/><text class="tx" x="84.0" y="147.8" text-anchor="end" dominant-baseline="central">10^-2</text><line x1="90.0" y1="98.9" x2="600.0" y2="98.9" class="ln" stroke-width="0.4" stroke-dasharray="4 3"/><text class="tx" x="84.0" y="98.9" text-anchor="end" dominant-baseline="central">10^-1</text><line x1="90.0" y1="50.0" x2="600.0" y2="50.0" class="ln" stroke-width="0.4" stroke-dasharray="4 3"/><text class="tx" x="84.0" y="50.0" text-anchor="end" dominant-baseline="central">10^0</text><text class="tx" x="244.5" y="284.0" text-anchor="middle" dominant-baseline="central">1 GB</text><text class="tx" x="399.1" y="284.0" text-anchor="middle" dominant-baseline="central">2 GB</text><text class="tx" x="553.6" y="284.0" text-anchor="middle" dominant-baseline="central">3 GB</text><circle cx="567.2" cy="227.9" r="7" fill="#8A887F" fill-opacity="0.9"/><text class="tx" x="555.2" y="217.9" text-anchor="end" dominant-baseline="central">BF16 + BF16 cache: perplexity 48.5</text><circle cx="329.1" cy="129.0" r="7" fill="#1D9E75" fill-opacity="0.9"/><text class="tx" x="341.1" y="119.0" text-anchor="start" dominant-baseline="central">FP8 + BF16 cache: perplexity 49.4</text><circle cx="216.8" cy="99.2" r="7" fill="#7F77DD" fill-opacity="0.9"/><text class="tx" x="228.8" y="89.2" text-anchor="start" dominant-baseline="central">INT4 + BF16 cache: perplexity 51.8</text><circle cx="329.1" cy="124.9" r="7" fill="none" stroke="#1D9E75" stroke-width="2"/><text class="tx" x="341.1" y="136.9" text-anchor="start" dominant-baseline="central">FP8 + FP8 cache: perplexity 49.6</text><circle cx="216.8" cy="98.0" r="7" fill="none" stroke="#7F77DD" stroke-width="2"/><text class="tx" x="228.8" y="110.0" text-anchor="start" dominant-baseline="central">INT4 + FP8 cache: perplexity 52.2</text><text class="tx" x="40.0" y="160.0" text-anchor="middle" dominant-baseline="central" transform="rotate(-90 40 160.0)">KL divergence</text><text class="ts" x="345.0" y="304.0" text-anchor="middle" dominant-baseline="central">weights in GPU memory</text><text class="ts" x="40.0" y="332.0" text-anchor="start" dominant-baseline="central">Filled: BF16 cache; ring: FP8 cache. The original model's perplexity on the same text is 48.5.</text><text class="ts" x="40.0" y="350.0" text-anchor="start" dominant-baseline="central">KL divergence: how surprised the original would be by each format's next-token odds (0 = identical).</text></svg>
